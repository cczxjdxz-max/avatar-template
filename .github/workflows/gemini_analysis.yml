# اسم سير العمل
name: 1. Gemini Game Analysis (via cURL)

# المشغل: يدوي
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'السؤال الذي سيتم طرحه على Gemini'
        required: true
        default: 'Deconstruct the core mechanics of the game Free Fire. Focus on player attributes, weapon stats, and the safe zone rules.'

# الوظائف
jobs:
  analyze_game_with_gemini:
    # الخادم
    runs-on: ubuntu-latest

    # الخطوات
    steps:
      # الخطوة 1: إرسال الطلب إلى Gemini API باستخدام cURL
      - name: Ask Gemini for Analysis via API
        id: gemini_call
        run: |
          # نقوم بتمرير مفتاح API الصحيح الذي قمت بتسجيله
          http_code=$(curl --silent --write-out '%{http_code}' --output response.json \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
            {
              "contents": [{
                "parts": [{
                  "text": "${{ github.event.inputs.query }}"
                }]
              }]
            }
          EOF
          )

          # طباعة رمز حالة HTTP للتأكد من نجاح الطلب
          echo "HTTP Status Code: $http_code"

          # التحقق من أن الطلب كان ناجحاً (رمز 200)
          if [ "$http_code" -ne 200 ]; then
            echo "Error calling Gemini API. See response below:"
            cat response.json
            exit 1
          fi

      # الخطوة 2: عرض الرد من Gemini
      - name: Display Gemini Response
        run: |
          echo "Gemini's response:"
          # تثبيت أداة jq لمعالجة JSON
          sudo apt-get install -y jq
          # استخدام jq لاستخراج النص الصافي من الرد وطباعته
          jq -r '.candidates[0].content.parts[0].text' response.json
