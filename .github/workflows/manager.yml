name: 1. The Manager (MIND) - File-less Edition

on:
  workflow_dispatch:

jobs:
  architect_the_plan:
    runs-on: ubuntu-latest
    steps:
      - name: "Invoke Gemini to Design the Extraction Script (In-line)"
        id: gemini_design
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          # ----------------- BEGIN IN-LINE PYTHON SCRIPT -----------------
          python3 -c '
          import os
          import subprocess
          import json

          # --- الإعدادات الأساسية ---
          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          model = "gemini-2.5-flash-lite"

          # --- البرومبت الهندسي الدقيق ---
          prompt = f"""
          You are a world-class reverse engineering expert specializing in Unity-based mobile games.
          Your mission is to generate a single, self-contained Python script. This script will be executed in a GitHub Actions Ubuntu environment to perform a deep data mining operation on a game APK.

          **Objective:**
          Extract core game data (controls, aim mechanics, weapons, walls, maps, character skeletons) and package it.

          **The Python script you generate MUST perform the following steps:**

          1.  **Environment Setup:**
              - Print every command being executed for clear logging.
              - Install necessary Ubuntu packages: `unzip`, `wget`.

          2.  **Download Game File:**
              - Download the APK from the URL: `{download_url}`. Name the file `game.apk`.

          3.  **Systematic Extraction Attempts (Crucial):**
              - **Method 1 (ZIP):** Try to unzip `game.apk` into a directory named `extracted_zip`. Use `|| true` to prevent workflow failure if it is not a valid zip.
              - **Method 2 (AssetStudio/AssetRipper):**
                  - Download the latest Linux console version of AssetRipper from its GitHub releases.
                  - Extract the tool.
                  - Execute it on `game.apk` to rip all assets into a directory named `extracted_assetripper`. Use `|| true`.

          4.  **Deep Data Filtering:**
              - Create a final directory named `CORE_DATA`.
              - Recursively search through *all* extraction directories (`extracted_zip`, `extracted_assetripper`).
              - Copy any file that meets the following criteria into `CORE_DATA`:
                  - File extension is `.json`, `.xml`, or `.lua`.
                  - Filename contains (case-insensitive) any of these keywords: `weapon`, `config`, `settings`, `player`, `character`, `skeleton`, `aim`, `control`, `map`, `gloo`, `wall`.

          5.  **Final Output:**
              - The script should not have any external dependencies besides standard Python libraries.
              - The entire logic must be in one single Python script.

          Generate ONLY the Python code for this script, enclosed in ```python ... ```.
          """

          # --- بناء أمر curl المطابق للمواصفات ---
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          headers = {
              "Content-Type": "application/json",
              "x-goog-api-key": api_key
          }
          data = {
              "contents": [{"parts": [{"text": prompt}]}]
          }
          json_data_string = json.dumps(data)
          curl_command = [
              "curl", "-s", "-X", "POST",
              "-H", f"Content-Type: {headers['Content-Type']}",
              "-H", f"x-goog-api-key: {headers['x-goog-api-key']}",
              url,
              "-d", json_data_string
          ]

          # --- التنفيذ ومعالجة الاستجابة ---
          try:
              print(f"Manager is invoking {model} via curl...")
              result = subprocess.run(curl_command, capture_output=True, text=True, check=True, timeout=90)
              response_json = json.loads(result.stdout)
              content = response_json["candidates"][0]["content"]["parts"][0]["text"]
              
              if "```python" in content:
                  script_code = content.split("```python")[1].split("```").strip()
              else:
                  script_code = content.strip()

              with open("miner_script.py", "w") as f:
                  f.write(script_code)
              
              print("Generated miner_script.py successfully.")

          except Exception as e:
              print(f"curl/Gemini call failed: {e}. Activating emergency fallback script.")
              fallback_script = """
import os, subprocess
print("EMERGENCY FALLBACK SCRIPT ACTIVATED")
url = os.getenv("GAME_DOWNLOAD_URL")
subprocess.run(f"wget {url} -O game.apk", shell=True)
subprocess.run("mkdir -p CORE_DATA && touch CORE_DATA/fallback_activated.txt", shell=True)
"""
              with open("miner_script.py", "w") as f:
                  f.write(fallback_script)
          '
          # ------------------ END IN-LINE PYTHON SCRIPT ------------------

      - name: "Archive the generated plan (script) for the Executor"
        uses: actions/upload-artifact@v4
        with:
          name: execution-plan
          path: miner_script.py

      - name: "Order the Executor to proceed"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          event-type: execute_extraction_plan
          client-payload: '{"message": "The plan is ready. Proceed with extraction."}'