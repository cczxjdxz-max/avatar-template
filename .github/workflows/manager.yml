name: 1. The Sovereign Absolute (All-in-One Fixer)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  sovereign_control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Supreme Reasoning & Self-Correction"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'Master Boot Initiated' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, re

          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          # البرومبت الذي يجمع القوة النرجسية والدقة التقنية
          prompt = f"""
          أنت 'المهندس السيادي المطلق'. هدفك الوحيد هو نجاح بناء تطبيق 'كاجيتان' الاحترافي.
          تقرير الحالة من الميدان: {reports}
          
          المطلوب منك هو هندسة الحل الكامل:
          1. main.py: واجهة سوداء وذهبية ملحمية، محاكاة 5 تريليون دورة، نظام تصويب OpenCV 'كل طلقة أحمر'.
          2. buildozer.spec: إعدادات NDK 25b و API 33 مع ضمان شمولية المكتبات.
          3. executor.yml: ملف Workflow كامل للمنفذ يصحح أخطاء النظام (مثل تقييد Cython < 3.0 لحل مشكلة 'long').
          
          يجب أن يكون ردك بصيغة JSON فقط بهذا الهيكل:
          {{ "workflow": "...", "spec": "...", "main_py": "..." }}
          """
          
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          
          # نظام النجاة الذاتي (قالب كاجيتان الذهبي)
          def emergency_payload():
              m = "from kivy.app import App\nfrom kivy.uix.label import Label\nfrom kivy.core.window import Window\nclass Kajitan(App):\n    def build(self):\n        Window.clearcolor = (0,0,0,1)\n        return Label(text='[color=FFD700][b]KAJITAN SOVEREIGN[/b][/color]', markup=True, font_size='40sp')\nKajitan().run()"
              s = "[app]\ntitle=Kajitan\npackage.name=kj.ai\nsource.dir=.\nversion=1.0\nrequirements=python3,kivy,opencv,numpy,android\nandroid.archs=arm64-v8a\nandroid.api=33\nandroid.ndk=25b"
              w = "name: 2. Combat Executor\non:\n  repository_dispatch:\n    types: [execute_build]\njobs:\n  execution:\n    runs-on: ubuntu-22.04\n    steps:\n      - uses: actions/checkout@v4\n      - name: Build System Setup\n        run: |\n          sudo apt update && sudo apt install -y python3-pip zip unzip build-essential\n          pip3 install --user --upgrade \"Cython<3.0\" buildozer virtualenv\n      - name: Build APK\n        run: |\n          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip\n          unzip -q android-ndk-r25b-linux.zip\n          export APP_ANDROID_NDK_PATH=$(pwd)/android-ndk-r25b\n          yes | buildozer android debug\n      - uses: actions/upload-artifact@v4\n        with:\n          name: Final-Kajitan-APK\n          path: bin/*.apk"
              return w, s, m

          try:
              res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=45).json()
              text = res['candidates'][0]['content']['parts'][0]['text']
              data = json.loads(re.search(r'\{.*\}', text, re.DOTALL).group())
              w, s, m = data['workflow'], data['spec'], data['main_py']
          except:
              print("AI Quota Exceeded. Activating Hardcoded Sovereign Core...")
              w, s, m = emergency_payload()

          with open('main.py', 'w') as f: f.write(m)
          with open('buildozer.spec', 'w') as f: f.write(s)
          with open('executor.yml', 'w') as f: f.write(w)
          EOF

      - name: "Universal Injection (Correcting Every CM)"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Absolute"
          git clone "https://${PAT_TOKEN}@github.com/cczxjdxz-max/Full.git" temp_full
          cp main.py temp_full/main.py
          cp buildozer.spec temp_full/buildozer.spec
          mkdir -p temp_full/.github/workflows
          cp executor.yml temp_full/.github/workflows/executor.yml
          cd temp_full
          git add . && git commit -m "Sovereign: Absolute Correction Applied" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/cczxjdxz-max/Full/dispatches"