name: 1. The Sovereign Manager
on:
  workflow_dispatch:
  repository_dispatch:
    types: [executor_failed, continue_mission]

jobs:
  manage_and_correct:
    runs-on: ubuntu-latest
    steps:
      - name: "1. Access Executor's Blueprint"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Assess Situation & Command Gemini"
        id: gemini_command
        run: |
          if [[ "${{ github.event.action }}" == "executor_failed" ]]; then
            echo "Analyzing failure..."
            ERROR_LOG="${{ github.event.client_payload.error_log }}"
            CURRENT_EXECUTOR_CODE=$(cat .github/workflows/executor.yml)
            PROMPT="CRITICAL: The Executor failed. Error: $ERROR_LOG. Current YAML: $CURRENT_EXECUTOR_CODE. Fix it perfectly. Output ONLY raw YAML."
          else
            echo "Designing new mission..."
            PROMPT="Design a high-level Executor YAML. Name: '2. The Executor'. Trigger: repository_dispatch (execute_mission). Task: Build Oracle APK, IQ 250, 12-trillion rounds. Output ONLY raw YAML."
          fi

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}")

          CORRECTED_CODE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed 's/```yaml//g; s/```//g')
          echo "$CORRECTED_CODE" > .github/workflows/executor.yml

      - name: "3. Deploy Corrected Blueprint"
        run: |
          git config --global user.name "The Sovereign Manager"
          git config --global user.email "manager@sovereign.ai"
          git add .github/workflows/executor.yml
          # تجاوز الخطأ في حال لم يتغير الكود
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Corrective Update: Deploying new operational blueprint."
            git push
            echo "Executor updated."
          else
            echo "No changes needed, blueprint is optimal."
          fi

      - name: "4. Dispatch 12-Trillion Mission"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # هنا نرسل أوامر "العقل" الحقيقية ليعالجها المنفذ
          MISSION_COMMANDS="echo 'Initiating IQ 250 Simulation...' && ./simulate_rounds.sh --rounds 12T --mode narcissistic"
          JSON_PAYLOAD=$(jq -n --arg cmd "$MISSION_COMMANDS" '{"event_type": "execute_mission", "client_payload": {"commands": $cmd}}')
          
          curl -L -X POST -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
               -d "$JSON_PAYLOAD"