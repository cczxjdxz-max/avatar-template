name: 1. The Manager - Dispatch Body Build
on:
  workflow_dispatch:

jobs:
  dispatch_command:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Executor to Build Empty APK
        run: |
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d '{"event_type": "build_empty_apk"}'