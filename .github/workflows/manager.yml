name: 1. The Manager (MIND) - Visual Simulation & Analysis

on:
  workflow_dispatch:

jobs:
  generate_visual_report:
    runs-on: ubuntu-latest
    steps:
      - name: "Request Visual Simulation Script"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests, json, base64

          prompt_text = """
          Generate a Python 3 script that visualizes the 'discovered_wisdom.dat' AI's combat strategy against 100 enemies.
          Use Matplotlib for an abstract, top-down 2D simulation:
          1. ENVIRONMENT: A 1000x1000m arena.
          2. ACTORS: 1 Hero (blue dot), 100 Enemies (red dots) moving towards the hero.
          3. AI LOGIC: The script should load 'discovered_wisdom.dat' to dictate the Hero's actions:
             - Movement: Hero's dot moves to avoid enemies.
             - Gloo Walls: Green lines appear to represent Gloo-Walls placed by the hero.
             - Aiming: A thin yellow line indicates the hero's aim towards an enemy's head.
          4. SIMULATION: Run for 100 frames, updating positions based on simple physics.
          5. OUTPUT: Save the animation as a GIF file (e.g., 'combat_simulation.gif').
          6. STATS: Print average enemy kill distance and hero's survival duration.
          """
          
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          headers = {"Content-Type": "application/json", "x-goog-api-key": os.getenv("GOOGLE_API_KEY")}
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          
          res = requests.post(url, headers=headers, json=payload).json()
          script_code = res['candidates'][0]['content']['parts'][0]['text'].split("```python")[1].split("```")[0].strip()
          
          encoded_plan = base64.b64encode(script_code.encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ENCODED_PLAN={encoded_plan}\n")
          EOF

      - name: "Send Plan to Executor for Video Generation"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: generate_video
          client-payload: '{"plan_base64": "${{ env.ENCODED_PLAN }}" }'