name: 1. The Sovereign Physician (Avatar-template)
on:
  workflow_dispatch:

jobs:
  generate_and_ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius AI Generation"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
        run: |
          PROMPT="Build a professional Kivy/Python app. UI: Luxury Black and Gold. Features: 1. Epic orchestral background music on start. 2. A 'Deep Simulation' counter showing 5 Trillion cycles progress. 3. Arrogant AI Chat interface (Narcissistic personality). 4. Video Analysis button for Free Fire. Use Kivy.core.audio for music. Reply with pure Python code only."
          G_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}"
          
          curl -s -X POST "$G_URL" -H "Content-Type: application/json" -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 << 'EOF'
          import json, re, sys
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              content = data['candidates'][0]['content']['parts'][0]['text']
              clean_code = re.sub(r'```python|```', '', content).strip()
              with open('main.py', 'w') as f_out:
                  f_out.write(clean_code)
          except Exception as e:
              print(f"Error: {e}")
              sys.exit(1)
          EOF

      - name: "Ship to FULL Repo"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Physician"
          git config --global user.email "ai@sovereign.world"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          
          # إنشاء ملف buildozer.spec مُحصن ومُحدث
          cat << 'EOF' > buildozer.spec
          [app]
          title = Sovereign AI
          package.name = sovereign.ai
          package.domain = org.sovereign
          source.dir = .
          version = 1.0.0
          requirements = python3,kivy,opencv,numpy,scipy
          orientation = portrait
          fullscreen = 0
          android.arch = arm64-v8a
          android.permissions = CAMERA, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, INTERNET, RECORD_AUDIO
          android.api = 31
          android.minapi = 21
          android.ndk = 21e
          EOF
          
          git add .
          git commit -m "Physician: Epic Music & 5 Trillion Logic Injected" || echo "No changes"
          git push origin main

      - name: "Trigger Executor"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -H "Accept: application/vnd.github.v3+json" \
          -d '{"event_type": "execute_build"}' \
          "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"