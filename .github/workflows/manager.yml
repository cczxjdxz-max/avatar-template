name: 1. The Manager (MIND) - AI Matrix Extractor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  design_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Design Matrix Extraction Plan"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import os, subprocess, json

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          
          prompt_text = f"""
          You are a Data Scientist. Target: {download_url}.
          Objective: Extract NUMERIC DATA for AI simulation.
          
          STRICT SCRIPT REQUIREMENTS:
          1. Check if the APK download is successful and size > 100MB. If not, EXIT WITH ERROR.
          2. Use 'zipfile' to find: 'Assembly-CSharp.dll', 'global-metadata.dat', and all '.json', '.bytes' files.
          3. Focus on 'assets/bin/Data/'.
          4. If CORE_DATA is empty at the end, the script must raise an Exception.
          5. DO NOT use sudo/apt.
          
          Generate ONLY the Python script.
          """
          
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}"
          
          result = subprocess.run(["curl", "-s", "-X", "POST", "-H", "Content-Type: application/json", "-d", json.dumps(payload), url], capture_output=True, text=True)
          response = json.loads(result.stdout)
          script_code = response["candidates"][0]["content"]["parts"][0]["text"].split("```python")[1].split("```")[0].strip()

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PLAN_SCRIPT={json.dumps(script_code)}\n")
          EOF

      - name: "Dispatch to Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_script": ${{ env.PLAN_SCRIPT }} }'