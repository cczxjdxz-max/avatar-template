name: 1. The Manager (MIND) - Gemini 2.5 Lite

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  design_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Design Matrix Extraction Plan"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import os, subprocess, json, sys

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          
          prompt_text = (
              f"Generate a Python 3 script for GitHub Actions. Target: {download_url}. "
              "Objective: Download APK and extract ONLY numeric/data files: "
              "'Assembly-CSharp.dll', 'global-metadata.dat', and all '.json', '.bytes' files "
              "from 'assets/bin/Data/'. If CORE_DATA is empty, script must exit(1). "
              "Generate ONLY the Python code inside ```python ... ``` blocks."
          )
          
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          # الرابط الذي طلبته بالضبط
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          
          try:
              result = subprocess.run([
                  "curl", "-s", "-X", "POST", 
                  "-H", "Content-Type: application/json",
                  "-H", f"x-goog-api-key: {api_key}",
                  "-d", json.dumps(payload), url
              ], capture_output=True, text=True)
              
              response = json.loads(result.stdout)
              
              if 'candidates' in response:
                  content = response['candidates'][0]['content']['parts'][0]['text']
                  script_code = content.split("```python")[1].split("```")[0].strip()
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write(f"PLAN_SCRIPT={json.dumps(script_code)}\n")
              else:
                  print("API Error Response:")
                  print(json.dumps(response, indent=2))
                  sys.exit(1)
                  
          except Exception as e:
              print(f"Execution Error: {e}")
              sys.exit(1)
          EOF

      - name: "Dispatch to Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_script": ${{ env.PLAN_SCRIPT }} }'