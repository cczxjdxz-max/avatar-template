name: 1. The Sovereign Overseer
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_up_call, executor_failed]

jobs:
  sovereign_logic_repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Pulling System Core"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Gemini IQ 250: Engine Reconstruction"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ERROR_LOG="${{ github.event.client_payload.error || 'System Active' }}"
          PROMPT="Act as Lelouch IQ 250. Perform Reverse Engineering for a Hitscan game. Focus: Accessibility Service control, Micro-tapping for zero spread, and Arabic dialect mastery for psychological play. If error exists ($ERROR_LOG), fix it. Output ONLY Python code."
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")
          
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed '/^```/d' | sed 's/null/None/g' > core_logic.py

      - name: "3. Force Sync & Purge Conflicts"
        run: |
          git config --global user.name "Lelouch-Overseer"
          git config --global user.email "overseer@britannia.ai"
          git reset --hard origin/main
          git clean -fd
          git add core_logic.py
          git commit -m "Logic Reconstructed: Zero Spread Ready" || echo "Stable"
          git push origin main --force
          sleep 60

      - name: "4. Deployment Signal (Protected Link)"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # حماية الرابط من خطأ Markdown bad range
          H="https://"
          G="api.github.com"
          R="/repos/cczxjdxz-max/Full/dispatches"
          U="${H}${G}${R}"
          
          curl -X POST "$U" \
               -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               -d '{"event_type": "continue_mission"}'