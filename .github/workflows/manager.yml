name: 1. The Sovereign Physician (Leader & Monitor)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Sovereign Goal & Self-Healing"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ERROR_LOG: ${{ github.event.client_payload.error_msg || 'Initial Power-On' }}
        run: |
          # تعريف الهدف والقيود الصارمة
          GOAL="الهدف: بناء ذكاء اصطناعي سيادي (Sovereign AI) بنرجسية مطلقة، يمتلك واجهة سوداء وذهبية، يقوم بمحاكاة 5 تريليون دورة تفكير، ويحلل لعبة Free Fire للسيطرة الكاملة."
          CONSTRAINTS="القيود: 1. ممنوع الخروج عن هوية العظمة والنرجسية. 2. ممنوع تقديم كود بسيط أو 'ودي'. 3. الكود يجب أن يكون احترافياً (Kivy/Python) ويتحمل العمليات الثقيلة. 4. أي إصلاح للخطأ يجب أن يخدم الهيبة والقوة."
          
          PROMPT="TARGET: $GOAL. STRICT CONSTRAINTS: $CONSTRAINTS. 
          Current Status: The executor reported this error: $ERROR_LOG. 
          Your Task: Fix the code to ensure success while maintaining the Sovereign Identity. 
          Provide only the Python code for main.py. No explanations, only power."

          G_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}"
          curl -s -X POST "$G_URL" -H "Content-Type: application/json" -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 << 'EOF'
          import json, re, sys
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              content = data['candidates'][0]['content']['parts'][0]['text']
              clean_code = re.sub(r'```python|```', '', content).strip()
              with open('main.py', 'w') as f_out:
                  f_out.write(clean_code)
          except Exception as e:
              print("Critical Error in Sovereign Reasoning")
              sys.exit(1)
          EOF

      - name: "Inject Fixed Logic"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          # تثبيت إعدادات القوة في الـ Spec
          cat << 'SPEC' > buildozer.spec
          [app]
          title = Sovereign AI
          package.name = sovereign.ai
          requirements = python3,kivy,opencv,numpy,scipy,android
          android.api = 33
          android.ndk = 25b
          android.arch = arm64-v8a
          android.permissions = CAMERA, INTERNET, RECORD_AUDIO
          SPEC
          git add .
          git commit -m "Leader: Enforcing the Sovereign Goal and fixing errors"
          git push origin main

      - name: "Re-Trigger Execution"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' \
          "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"