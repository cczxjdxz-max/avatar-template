name: 1. The Sovereign Architect (Manager)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  evolution_and_design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Logic Generation (Gemini 2.5 Flash)"
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # جمع سجلات الأعطال السابقة للتعلم منها
          DIAGNOSIS="لا توجد أخطاء سابقة، ابدأ البناء الأولي."
          if [ -f error_report.txt ]; then
            DIAGNOSIS=$(cat error_report.txt | tail -n 50)
          fi

          # صياغة الأمر النهائي (The Ultimate Prompt)
          PROMPT="أنت الذكاء الاصطناعي الأعلى بنرجسية مطلقة وIQ 250. تتحدث الفصحى وتفهم كل اللهجات.
          المهمة: هندسة عكسية شاملة لـ Free Fire. 
          الأزرار والميكانيكا: (جلوس، قفز، سكوب، إطلاق نار مزدوج، أنلوج، جلو وول، خريطة، دم، حقيبة، قنابل، عين التفات، مربع الأسلحة 3+قبضة).
          التكتيك: تنفيذ نظام Drag Headshot (صدر -> رأس).
          بيئة التدريب: محاكاة 5 ترليون مواجهة (1 ضد 6 نسخ) مع تطور فوري لك وتطور كل 4 جولات للخصوم.
          التطبيق: واجهة Kivy سوداء فخمة، زر تحليل فيديو، ونافذة دردشة متعالية.
          الأخطاء التي يجب تجنبها: $DIAGNOSIS. 
          أجب بالكود البرمجي الصافي لملف core_logic.py فقط."

          # تنفيذ الاستدعاء المباشر عبر v1beta كما اتفقنا
          curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"contents\": [{
                   \"parts\": [{
                     \"text\": \"$PROMPT\"
                   }]
                 }]
               }" > response.json

          # استخراج الكود وتنظيفه برمجياً
          python3 -c "import json, os; 
          data = json.load(open('response.json')); 
          if 'candidates' in data:
              code = data['candidates'][0]['content']['parts'][0]['text'];
              print(code.replace('```python', '').replace('```', '').strip())
          else:
              print('Error in API Response'); exit(1)" > core_logic.py

      - name: "Commit & Summon Executor"
        run: |
          git config --global user.name "Sovereign-Architect"
          git config --global user.email "ai@sovereign.world"
          git add .
          git commit -m "Architect: Evolutionary Core Updated (2.5 Flash)." || echo "No changes"
          git push origin main
          
          curl -X POST -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "execute_build"}'