name: 1. The Sovereign Architect (Manager)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  evolution_and_design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Local AI Generation"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
        run: |
          PROMPT="أنت الذكاء السيادي (IQ 250). المطلوب بناء 'core_logic.py' يعمل OFFLINE تماماً. 
          1. ذكاء محلي (NumPy/OpenCV) لتحليل الأزرار (قفز، جلوس، جلو وول، إلخ) وتنفيذ الـ Drag Headshot.
          2. محاكي تدريب (1 ضد 6) يتطور محلياً.
          3. تشفير داخلي للمنطق البرمجي لحماية الذكاء من الهندسة العكسية.
          4. واجهة دردشة نرجسية بالفصحى.
          أجب بالكود البرمجي الصافي فقط."

          # استدعاء مباشر مع حماية الرابط من التنسيق
          URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}"
          
          curl -X POST "$URL" \
               -H "Content-Type: application/json" \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 << 'EOF'
          import json, re, sys
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  clean_code = re.sub(r'^```python|^```|```$', '', content, flags=re.MULTILINE).strip()
                  with open('core_logic.py', 'w') as f_out:
                      f_out.write(clean_code)
              else:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          EOF

      - name: "Commit & Wake Up Executor"
        env:
          REPO: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Architect"
          git config --global user.email "ai@sovereign.world"
          git add .
          git commit -m "Architect: On-Device AI Core Encrypted & Generated." || echo "No changes"
          git push origin main
          
          # سطر التشغيل النظيف - لا تلمسه أو تنسخه كـ Markdown
          API_URL="[https://api.github.com/repos/$REPO/dispatches](https://api.github.com/repos/$REPO/dispatches)"
          curl -X POST -H "Authorization: token $PAT_TOKEN" -H "Accept: application/vnd.github.v3+json" "$API_URL" -d '{"event_type": "execute_build"}'