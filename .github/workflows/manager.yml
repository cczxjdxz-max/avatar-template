name: 1. The Sovereign Physician (Avatar-template)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed]

jobs:
  generate_and_ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Logic Generation"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
        run: |
          PROMPT="أنت الذكاء السيادي. المطلوب كود core_logic.py كامل (Kivy + Offline AI) لتحليل فري فاير وهيدشوت. أجب بالكود فقط."
          G_URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}"
          curl -X POST "$G_URL" -H "Content-Type: application/json" -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json
          python3 -c "import json, re; data = json.load(open('response.json')); content = data['candidates'][0]['content']['parts'][0]['text']; print(re.sub(r'^```python|^```|```$', '', content, flags=re.MULTILINE).strip())" > core_logic.py

      - name: "Ship Logic to FULL Repo"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Physician"
          git config --global user.email "ai@sovereign.world"
          # استنساخ مستودع Full لإضافة الكود إليه
          git clone https://${PAT_TOKEN}@[github.com/$](https://github.com/$){{ github.repository_owner }}/Full.git temp_full
          cp core_logic.py temp_full/
          cd temp_full
          git add core_logic.py
          git commit -m "Physician: Injecting evolved core logic." || echo "No changes"
          git push origin main

      - name: "Wake Up Executor in FULL"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          P1="https"; P2="api.github.com"; P3="repos"
          FULL_URL="${P1}://${P2}/${P3}/${REPO_OWNER}/Full/dispatches"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
               -H "Authorization: token ${PAT_TOKEN}" \
               -H "Accept: application/vnd.github.v3+json" \
               -d '{"event_type": "execute_build"}' \
               "${FULL_URL}")
          echo "Full Repo Response: $RESPONSE"