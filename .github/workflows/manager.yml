name: 1. The Sovereign Manager
on:
  workflow_dispatch:
  repository_dispatch:
    types: [executor_failed, continue_mission]

jobs:
  manage_and_evolve:
    runs-on: ubuntu-latest
    steps:
      - name: "1. Access Executor Blueprint"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}
          ref: main 

      - name: "2. Gemini IQ 250 Architecture"
        id: gemini_logic
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ERROR_DATA="${{ github.event.client_payload.error_log }}"
          PROMPT="Architect a high-precision Executor for Free Fire One-Shot logic. Context: 200m zone, Desert Eagle, M1887. History: System reported $ERROR_DATA. Task: Refine the YAML logic to process 12 Trillion simulations. Output ONLY raw YAML."

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")

          CLEAN_CODE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed 's/```yaml//g; s/```//g' | sed '/^$/d')

          mkdir -p .github/workflows
          if [ -z "$CLEAN_CODE" ] || [ "$CLEAN_CODE" == "null" ]; then
            echo "Deploying Sovereign Core Template..."
            # تم إصلاح التضارب هنا باستخدام الهروب البرمجي للعلامات
            echo "name: 2. The Executor" > .github/workflows/executor.yml
            echo "on: [workflow_dispatch, repository_dispatch]" >> .github/workflows/executor.yml
            echo "jobs:" >> .github/workflows/executor.yml
            echo "  execute:" >> .github/workflows/executor.yml
            echo "    runs-on: ubuntu-latest" >> .github/workflows/executor.yml
            echo "    steps:" >> .github/workflows/executor.yml
            echo "      - uses: actions/checkout@v4" >> .github/workflows/executor.yml
            echo "      - run: \${{ github.event.client_payload.commands }}" >> .github/workflows/executor.yml
          else
            echo "$CLEAN_CODE" > .github/workflows/executor.yml
          fi

      - name: "3. Inject Vision into Executor"
        run: |
          git config --global user.name "Sovereign Manager"
          git config --global user.email "manager@sovereign.ai"
          git add .github/workflows/executor.yml
          git commit -m "Evolution Cycle: Implementing IQ 250 Vision" || echo "Optimized"
          git push origin main --force

      - name: "4. Trigger 12T Mission"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          sleep 10
          MISSION="echo 'Initiating 12T Simulation...' && python3 -c 'import random; print(f\"Cycle: {random.randint(1, 10**12)}\")' && sleep 5"
          JSON=$(jq -n --arg cmd "$MISSION" '{"event_type": "execute_mission", "client_payload": {"commands": $cmd}}')
          curl -L -X POST -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
               -d "$JSON"