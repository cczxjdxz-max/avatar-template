name: 1. The Sovereign Manager
on:
  workflow_dispatch:
  repository_dispatch:
    types: [executor_failed, continue_mission]

jobs:
  manage_and_correct:
    runs-on: ubuntu-latest
    steps:
      - name: "1. Access Executor Blueprint"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Secure Gemini Diagnostic"
        id: gemini_command
        run: |
          # تجهيز سجل الخطأ والكود الحالي في ملفات لتجنب مشاكل علامات الاقتباس
          echo "${{ github.event.client_payload.error_log }}" > error.log
          cat .github/workflows/executor.yml > current.yml || echo "init" > current.yml
          
          ERROR_DATA=$(cat error.log)
          YAML_DATA=$(cat current.yml)

          # بناء البرومبت بشكل آمن داخل JSON
          PROMPT="Fix this GitHub Workflow YAML. Error: $ERROR_DATA. Code: $YAML_DATA. Output ONLY raw YAML."
          
          # استدعاء جيمني مع التحقق من الرد
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{
                 \"contents\": [{
                   \"parts\": [{
                     \"text\": \"$PROMPT\"
                   }]
                 }]
               }")

          # استخراج الكود وتنظيفه
          CORRECTED=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed 's/```yaml//g; s/```//g' | sed '/^$/d')

          # خطة الطوارئ: إذا فشل جيمني، نضع كوداً افتراضياً ناجحاً
          if [ -z "$CORRECTED" ] || [ "$CORRECTED" == "null" ]; then
            echo "Warning: Gemini returned empty. Using Sovereign Default Template."
            cat <<EOF > .github/workflows/executor.yml
name: 2. The Executor
on:
  repository_dispatch:
    types: [execute_mission]
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: \${{ github.event.client_payload.commands }}
EOF
          else
            echo "$CORRECTED" > .github/workflows/executor.yml
          fi

      - name: "3. Forced Push"
        run: |
          git config --global user.name "The Sovereign Manager"
          git config --global user.email "manager@sovereign.ai"
          git add .github/workflows/executor.yml
          git commit -m "Emergency Correction: Repairing Logic Bridge" || echo "No changes"
          git push origin main