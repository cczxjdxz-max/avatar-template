name: 1. The Sovereign Physician (Manager)
on:
  repository_dispatch:
    types: [start_mission, doctor_needed] # يبدأ عند الطلب أو عند استغاثة المنفذ

jobs:
  think_and_heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: AI Brain Setup
        uses: actions/setup-python@v4
        with: { python-version: '3.9' }

      - name: Install Intelligence
        run: pip install google-generativeai

      - name: "AI Diagnostics & Logic Generation"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'EOF'
          import google.generativeai as genai
          import os

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          # 1. التحقق من وجود تقرير فشل (التشخيص الطبي)
          diagnosis = ""
          if os.path.exists("error_report.txt"):
              with open("error_report.txt", "r") as f:
                  diagnosis = f"\nCRITICAL ERROR FOUND:\n{f.read()}"

          # 2. صياغة الأمر لـ Gemini (المساند)
          prompt = f"""
          You are the Sovereign AI Architect. {diagnosis}
          Task: Create a professional Kivy 'core_logic.py' for Android.
          If there's an error above, FIX IT in the code or settings.
          Provide ONLY the Python code. No chatter.
          """
          
          response = model.generate_content(prompt)
          with open("core_logic.py", "w") as f:
              f.write(response.text)
          EOF

      - name: "Commit & Deploy Order"
        run: |
          git config --global user.name "Sovereign-Physician"
          git config --global user.email "doctor@sovereign.ai"
          git add .
          git commit -m "Physician: Diagnostic complete. Applied treatment." || echo "No changes"
          git push origin main
          
          # إرسال الأمر للمنفذ لبدء العمل/الإعادة
          curl -X POST -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "execute_build"}'