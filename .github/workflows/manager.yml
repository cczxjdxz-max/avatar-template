name: 1. Leader Blitz - Final Call
on:
  workflow_dispatch:
jobs:
  dispatch_job:
    runs-on: ubuntu-latest
    steps:
      - name: "Send Mission to Full"
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d '{"event_type": "run_blitz_evo", "client_payload": {"plan": "SGVsbG8gR29kIE1vZGU="}}'
          
          # ملاحظة: إذا ظهر لك خطأ 404، فاسم المستودع أو المستخدم خطأ.
          # إذا ظهر 401، فالتوكن (PAT) غير صالح.