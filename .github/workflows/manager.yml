name: 1. The Sovereign Physician (Supreme Commander)
on:
  workflow_dispatch: # زر التشغيل اليدوي من قسم Actions
  repository_dispatch:
    types: [sequential_heal_request, vision_heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "AI Brain or Sovereign Backup"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'Manual Sovereign Boot' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, sys, re

          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          # محاولة جلب الذكاء من عدة موديلات لكسر الحظر
          models = ["gemini-1.5-flash", "gemini-2.0-flash-exp", "gemini-1.5-flash-8b"]
          prompt = f"أنت الذكاء السيادي. المهمة: كود Python لملف main.py (Kivy/OpenCV). المواصفات: واجهة سوداء وذهبية، موسيقى ملحمية، محاكاة 5 تريليون دورة، طلقات حمراء فري فاير. التقرير: {reports}. أجب بالكود فقط."
          
          success = False
          if api_key:
              for model in models:
                  try:
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"
                      res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=15)
                      data = res.json()
                      if 'candidates' in data:
                          content = data['candidates'][0]['content']['parts'][0]['text']
                          with open('main.py', 'w') as f: f.write(re.sub(r'```python|```', '', content).strip())
                          print(f"Captured by {model}")
                          success = True; break
                  except: continue

          if not success:
              print("Using Sovereign Backup Template...")
              backup = """
from kivy.app import App
from kivy.uix.label import Label
from kivy.core.window import Window
class SovereignAI(App):
    def build(self):
        Window.clearcolor = (0, 0, 0, 1)
        return Label(text='[color=FFD700][b]SOVEREIGN AI: READY[/b][/color]\\n[size=20]Wait for Battle...[/size]', markup=True, font_size='32sp')
if __name__ == '__main__': SovereignAI().run()
"""
              with open('main.py', 'w') as f: f.write(backup.strip())
          EOF

      - name: "Sync to Executor"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          echo -e "[app]\ntitle=Sovereign AI\npackage.name=sovereign.ai\nrequirements=python3,kivy,opencv,numpy,android\nandroid.api=33\nandroid.ndk=25b\nandroid.arch=arm64-v8a" > buildozer.spec
          git add . && git commit -m "Leader: Sovereign Update" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"