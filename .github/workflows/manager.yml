name: 1. The Sovereign Overseer
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_up_call, executor_failed]

jobs:
  manage_and_fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Accessing Sovereign Realm"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Gemini IQ 250: Absolute Logic Engineering"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ERROR_DATA="${{ github.event.client_payload.error || 'Initiate Sovereign Protocol' }}"
          PROMPT="Act as Lelouch IQ 250. Target: core_logic.py for Hitscan game. Focus on: Accessibility Service, Zero-Spread micro-taps, Autonomous play, and Arabic dialect mastery. Fix: $ERROR_DATA. Output ONLY Python."
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")
          
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed '/^```/d' | sed 's/null/None/g' > core_logic.py

      - name: "3. Force Sync & Persistence"
        run: |
          git config --global user.name "Lelouch-Overseer"
          git config --global user.email "overseer@britannia.ai"
          git reset --hard origin/main
          git clean -fd
          git add core_logic.py
          git commit -m "Auto-Repair Cycle Complete" || echo "Clean"
          git push origin main --force
          sleep 300

      - name: "4. Deployment Signal (Protected URL)"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # استراتيجية التشفير لهزيمة خطأ URL position 2
          H="https://"
          G="api.github.com"
          R="/repos/cczxjdxz-max/Full/dispatches"
          FINAL_URL="${H}${G}${R}"
          
          curl -X POST "$FINAL_URL" \
               -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               -d '{"event_type": "continue_mission"}'