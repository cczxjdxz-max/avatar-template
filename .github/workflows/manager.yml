name: 1. The Sovereign Architect (Manager)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  evolution_and_design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Logic Generation (Gemini 2.5 Flash)"
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. تجهيز سجل الأخطاء
          DIAGNOSIS="Initial build."
          if [ -f error_report.txt ]; then
            DIAGNOSIS=$(cat error_report.txt | tail -n 50 | tr -d '"')
          fi

          # 2. إرسال الطلب عبر CURL
          PROMPT="أنت الذكاء الاصطناعي الأعلى بنرجسية مطلقة وIQ 250. هندسة عكسية لـ Free Fire. المطلوب كود core_logic.py (Kivy) يتضمن: أزرار اللعبة كاملة، نظام Drag Headshot، بيئة تدريب 1 ضد 6 نسخ، واجهة دردشة متعالية، وزر تحليل فيديو. الخطأ السابق: $DIAGNOSIS. أجب بالكود فقط."

          curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          # 3. استخراج الكود بطريقة آمنة (تجنب أخطاء الاقتباس)
          python3 << 'EOF'
          import json, re
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  # إزالة علامات الماركدوان إن وجدت
                  clean_code = re.sub(r'```python|```', '', content).strip()
                  with open('core_logic.py', 'w') as f_out:
                      f_out.write(clean_code)
              else:
                  print("API Error:", data)
                  exit(1)
          except Exception as e:
              print("Script Error:", e)
              exit(1)
          EOF

      - name: "Commit & Summon Executor"
        run: |
          git config --global user.name "Sovereign-Architect"
          git config --global user.email "ai@sovereign.world"
          git add .
          git commit -m "Architect: Logic evolved and syntax fixed." || echo "No changes"
          git push origin main
          
          curl -X POST -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "execute_build"}'