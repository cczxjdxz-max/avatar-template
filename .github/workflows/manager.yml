name: 1. The Sovereign Physician (Gemini 2.5 Flash Lite)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Sovereign AI Reasoning"
        env:
          # تم التعديل للاسم الصحيح هنا
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'System Startup' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, sys

          # جلب المفتاح بالاسم الصحيح
          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          if not api_key:
              print("Critical Error: GOOGLE_API_KEY is missing in Secrets!")
              sys.exit(1)

          prompt_text = f"أنت الذكاء السيادي. المهمة: كود Python لملف main.py (Kivy/OpenCV). المواصفات: واجهة سوداء وذهبية نرجسية، موسيقى هيبة، محاكاة 5 تريليون دورة. التقرير: {reports}. أصلح أي خطأ لضمان 'كل طلقة أحمر' في فري فاير (حساب ضيف). أجب بالكود فقط."
          
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key={api_key}"
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          
          try:
              response = requests.post(url, json=payload)
              data = response.json()
              
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  # تنظيف وحفظ الكود
                  import re
                  clean_code = re.sub(r'```python|```', '', content).strip()
                  with open('main.py', 'w') as f:
                      f.write(clean_code)
                  print("Success: Sovereign Code Generated")
              else:
                  print("API Error Response:", json.dumps(data, indent=2))
                  sys.exit(1)
          except Exception as e:
              print(f"Network or JSON Error: {e}")
              sys.exit(1)
          EOF

      - name: "Deploy to Executor"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          echo "[app]\ntitle=Sovereign AI\npackage.name=sovereign.ai\nrequirements=python3,kivy,opencv,numpy,android\nandroid.api=33\nandroid.ndk=25b\nandroid.arch=arm64-v8a" > buildozer.spec
          git add . && git commit -m "Leader: Auto-Update via Gemini 2.5" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"