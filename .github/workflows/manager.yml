      - name: "Design 1vs100 Tactical Arena"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests, json, base64

          prompt_text = """
          Generate a Python 3 script for an Advanced Battle Simulation:
          1. SCENARIO: 1 Hero vs 100 Enemies. 
          2. STATS: Each enemy has 250 HP. Hero focuses on Headshot (Damage: 150-300 per hit).
          3. LOGIC: 
             - Hero detects 'Knockdown' event to switch targets instantly.
             - Hero has 15s to 'Buy Gear' before the 1000m distance gap closes.
             - Infinite Gloo-Walls for defense.
          4. AI TRAINING: Use Reinforcement Learning to optimize 'Time-to-Kill' (TTK) against 100 targets.
          5. SCALE: Simulate 99^20 iterations.
          6. STATS: Track 'Headshot Accuracy', 'Average TTK', and 'Gloo-Wall reaction time'.
          7. SAVE: Export weights to 'warrior_pro.dat'.
          """
          
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          headers = {"Content-Type": "application/json", "x-goog-api-key": os.getenv("GOOGLE_API_KEY")}
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          
          res = requests.post(url, headers=headers, json=payload).json()
          script_code = res['candidates'][0]['content']['parts'][0]['text'].split("```python")[1].split("```")[0].strip()
          
          encoded_plan = base64.b64encode(script_code.encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ENCODED_PLAN={encoded_plan}\n")
          EOF