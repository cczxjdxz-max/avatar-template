name: 1. The Sovereign Physician (Manager)
on:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  heal_and_order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python3-version: '3.9'

      - name: Install AI Brain
        run: pip install google-generativeai

      - name: "Doctor Analysis & Repair"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'EOF'
          import google.generativeai as genai
          import os

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          def diagnose():
              if not os.path.exists("error_report.txt"):
                  print("No sickness detected. Starting fresh mission.")
                  return "Create a basic Kivy 'Hello World' app."

              with open("error_report.txt", "r") as f:
                  logs = f.read()
              
              prompt = f"The following Android build error occurred: {logs}. Provide the corrected version of buildozer.spec or the necessary fix in core_logic.py. Give me ONLY the code."
              response = model.generate_content(prompt)
              return response.text

          treatment = diagnose()
          # تطبيق الإصلاح على الملفات
          with open("core_logic.py", "w") as f:
              f.write(treatment)
          EOF

      - name: "Apply Treatment to Repository"
        run: |
          git config --global user.name "Sovereign-Physician"
          git config --global user.email "doctor@sovereign.ai"
          git add .
          git commit -m "Treatment applied: Fixing build errors and retrying." || echo "No changes to commit"
          git push origin main

      - name: "Re-send Patient to Surgery"
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "continue_mission"}'