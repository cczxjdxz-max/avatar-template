name: 1. The Sovereign Architect (IQ 250)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  forge_the_god_ai:
    runs-on: ubuntu-latest
    steps:
      - name: "Accessing Sovereign Memory"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "Gemini IQ 250: Dissection & Hyper-Training"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          PROMPT="Act as an IQ 250 AI Architect. 
          Target Game: Free Fire. 
          Mission: 
          1. DISSECT: Reverse-engineer 'Full Control' physics, 11-button layout, and spread reset timing.
          2. TRAIN: Simulate 5 trillion matches in a virtual sandbox.
          3. ENTITY: Generate 'core_logic.py' in Python. 
          Features: Smart movement (jiggles), Video Analysis module, Narcissistic persona, speaks Fusha, understands Arabic dialects. 
          Output ONLY the Python code."

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")
          
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed '/^```/d' > core_logic.py

      - name: "Commit The Sovereign Logic"
        run: |
          git config --global user.name "Lelouch-Architect"
          git config --global user.email "architect@sovereign.ai"
          git add core_logic.py
          git commit -m "5 Trillion Training Cycles Complete. Entity Evolved." || exit 0
          git push origin main --force

      - name: "Wake Up The Executor (Base64 Shield)"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # الرابط مشفر لمنع المحرر من إضافة الأقواس المربعة
          ENCODED_URL="aHR0cHM6Ly9hcGkuZ2l0aHViLmNvbS9yZXBvcy9jY3p4amR4ei1tYXgvRnVsbC9kaXNwYXRjaGVz"
          FINAL_URL=$(echo "$ENCODED_URL" | base64 --decode)
          
          curl -L -X POST "$FINAL_URL" \
          -H "Authorization: Bearer $PAT" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"event_type": "continue_mission"}'