      - name: "2. Secure Diagnostic & Gemini Repair"
        id: gemini_logic
        run: |
          ERROR_DATA="${{ github.event.client_payload.error_log }}"
          PROMPT="The Executor reported a strategic failure: $ERROR_DATA. 
          Your mission is to increase the One-Shot accuracy to 100% for Desert Eagle. 
          Analyze why the precision was low and rewrite the Executor's logic to be more aggressive and precise (IQ 250). 
          Output ONLY raw YAML for the executor."

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")

          CLEAN_CODE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | sed 's/```yaml//g; s/```//g' | sed '/^$/d')
          
          # (بقية كود الدفع والتشغيل المذكور سابقاً يبقى كما هو لضمان الاستمرارية)