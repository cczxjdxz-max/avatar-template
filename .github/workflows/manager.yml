name: 1. The Manager (MIND) - Surgical v4

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  evolve_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Analyze Surgical Report and Design Plan"
        id: design
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
          FAILURE_LOG_ENCODED: ${{ github.event.client_payload.execution_log || '' }}
        run: |
          python3 << 'EOF'
          import os, subprocess, json, base64

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          encoded_log = os.getenv("FAILURE_LOG_ENCODED")

          if encoded_log:
              try:
                  failure_log = base64.b64decode(encoded_log).decode('utf-8', 'ignore')
              except:
                  failure_log = "Log decoding failed. Previous attempt failed."
          else:
              failure_log = "This is the first mission. Objective: Download and extract."

          # --- البرومبت الجراحي ---
          prompt_text = f"""
          You are a surgical reverse engineering expert. You will receive a highly focused error report.
          Your task is to generate a Python script that specifically solves THIS error.

          **FOCUSED SURGICAL ERROR REPORT:**
          ```
          {failure_log}
          ```

          **YOUR CORRECTIVE ACTION:**
          Based *only* on the surgical report, generate a new Python script that fixes this specific problem.
          - If the report says 'CORE_DATA is empty', it means your previous script ran without errors but produced no files. The extraction method was wrong. Try a different one (e.g., if you used 'zipfile', now use command-line 'unzip').
          - If the report shows a 'Traceback', fix the Python error.
          - If the report shows a command-line error (like 'unzip failed'), try another command or a different library.
          - Be state-aware: check for 'game.apk' before downloading.
          - Generate ONLY the Python code.
          """
          
          # ... (نفس كود استدعاء Gemini وحفظ السكربت) ...
          # (لا تغيير هنا، فقط في البرومبت)
          script_code = "# Fallback script"
          try:
              payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
              curl_cmd = ["curl", "-s", url, "-H", "Content-Type: application/json", "-H", f"x-goog-api-key: {api_key}", "-X", "POST", "-d", json.dumps(payload)]
              result = subprocess.run(curl_cmd, capture_output=True, text=True, check=True, timeout=90)
              response = json.loads(result.stdout)
              content = response["candidates"][0]["content"]["parts"][0]["text"]
              script_code = content.split("```python").split("```")[0].strip() if "```python" in content else content.strip()
          except Exception as e:
              print(f"Gemini call failed: {e}")
              script_code = "import sys\nprint(f'Gemini call failed: {e}')\nsys.exit(1)"

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PLAN_SCRIPT={json.dumps(script_code)}\n")
          EOF

      - name: "Issue Surgical Command to The Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_script": ${{ env.PLAN_SCRIPT }} }'