      - name: "Design Headshot Arena Plan"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python3 << 'EOF'
          import os, requests, json, base64

          prompt_text = """
          Generate a High-Speed Python Simulation for Reinforcement Learning:
          1. SCENARIO: 1 Main Agent vs 6 Enemy Agents.
          2. GOAL: Main Agent must target ONLY the 'Head' vector (y-axis offset).
          3. LOGIC: 
             - Use Vectorized Math (NumPy style) to simulate 4 trillion shots.
             - Main Agent has 'Aim-Lock' logic on Head coordinates.
             - Enemies have standard movement patterns.
          4. RULES: Infinite Ammo and Infinite Gloo Walls for the Main Agent.
          5. STATS: Track Headshot Ratio, Wins, and Deaths for the Main Agent.
          6. OUTPUT: Write a detailed summary to 'README.md' and save model weights to 'headshot_model.dat'.
          """
          
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          headers = {"Content-Type": "application/json", "x-goog-api-key": os.getenv("GOOGLE_API_KEY")}
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
          
          res = requests.post(url, headers=headers, json=payload).json()
          script_code = res['candidates'][0]['content']['parts'][0]['text'].split("```python")[1].split("```")[0].strip()
          
          encoded_plan = base64.b64encode(script_code.encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ENCODED_PLAN={encoded_plan}\n")
          EOF