name: 1. The Sovereign Physician (Manager)
on:
  workflow_dispatch: # هذا السطر يظهر زر "Run workflow" يدوياً
  repository_dispatch:
    types: [start_mission, doctor_needed]

jobs:
  think_and_heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install AI Core
        run: pip install google-generativeai

      - name: "AI Diagnostic & Repair"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'EOF'
          import google.generativeai as genai
          import os

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          model = genai.GenerativeModel('gemini-1.5-flash')

          # التحقق من وجود تقرير فشل سابق
          diagnosis_context = ""
          if os.path.exists("error_report.txt"):
              with open("error_report.txt", "r") as f:
                  diagnosis_context = f"\n[URGENT] Previous build failed with these errors:\n{f.read()}"

          prompt = f"""
          You are the Sovereign AI Physician. {diagnosis_context}
          Task: Generate a high-quality Kivy 'core_logic.py' for an Android app.
          If there was an error, fix the logic or the build settings.
          Return ONLY the Python code. No markdown or talk.
          """
          
          response = model.generate_content(prompt)
          with open("core_logic.py", "w") as f:
              f.write(response.text)
          EOF

      - name: "Commit Healing"
        run: |
          git config --global user.name "Sovereign-Physician"
          git config --global user.email "doctor@sovereign.ai"
          git add .
          git commit -m "Physician: Applied treatment and updated logic." || echo "Clean"
          git push origin main

      - name: "Dispatch Order to Executor"
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "execute_build"}'