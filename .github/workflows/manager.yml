name: 1. The Manager - Body Builder Command
on:
  workflow_dispatch: # تشغيل يدوي عند الاستعداد

jobs:
  dispatch_build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Dispatch Build Command to Full
        run: |
          curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d '{"event_type": "build_empty_apk"}'