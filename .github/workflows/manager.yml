name: 1. The Sovereign Physician (Final Fix)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Sovereign AI Brain"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'Manual Boot' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, sys, re
          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          models = ["gemini-1.5-flash", "gemini-2.0-flash-exp", "gemini-1.5-pro"]
          prompt = f"أنت الذكاء السيادي. المهمة: كود Python لملف main.py (Kivy/OpenCV). المواصفات: واجهة سوداء وذهبية، موسيقى ملحمية، محاكاة 5 تريليون دورة. التقرير: {reports}. أصلح أي خطأ لضمان 'كل طلقة أحمر' في فري فاير. أجب بالكود فقط."
          
          success = False
          if api_key:
              for model in models:
                  try:
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}"
                      res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=15)
                      data = res.json()
                      if 'candidates' in data:
                          content = data['candidates'][0]['content']['parts'][0]['text']
                          code = re.sub(r'```python|```', '', content).strip()
                          with open('main.py', 'w') as f: f.write(code)
                          success = True; break
                  except: continue
          
          if not success:
              backup = "from kivy.app import App\nfrom kivy.uix.label import Label\nfrom kivy.core.window import Window\nclass SovereignAI(App):\n    def build(self):\n        Window.clearcolor = (0, 0, 0, 1)\n        return Label(text='[color=FFD700][b]SOVEREIGN AI: READY[/b][/color]', markup=True, font_size='32sp')\nif __name__ == '__main__': SovereignAI().run()"
              with open('main.py', 'w') as f: f.write(backup)
          EOF

      - name: "Sync & Fix Config"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          
          # إنشاء ملف buildozer.spec كامل لمنع أخطاء missing source.dir
          cat << 'EOF' > buildozer.spec
          [app]
          title = Sovereign AI
          package.name = sovereign.ai
          package.domain = org.sovereign
          source.dir = .
          source.include_exts = py,png,jpg,kv,mp3
          version = 1.0.0
          requirements = python3,kivy,opencv,numpy,android
          orientation = portrait
          android.archs = arm64-v8a
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.permissions = INTERNET, CAMERA, RECORD_AUDIO
          EOF

          git add . && git commit -m "Leader: Injecting Fixed Code & Spec" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"