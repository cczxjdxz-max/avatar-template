name: 1. Supreme Sovereign Physician (Ultimate Controller)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Total System Reasoning"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'System Startup' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, sys, re
          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          # البرومبت الآن يطلب تصحيح "بيئة العمل" كاملة
          prompt = f"أنت المهندس السيادي العظيم. تقرير الفشل: {reports}. المطلوب إصلاح شامل: 1- كود main.py 2- إعدادات buildozer.spec 3- أوامر الشل في الـ workflow. تأكد من حل مشاكل Cython و long و NDK. أجب بصيغة JSON تحتوي على الحقول الثلاثة فقط."
          
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          # طلب الرد بصيغة JSON لسهولة التوزيع
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"response_mime_type": "application/json"}
          }
          
          try:
              res = requests.post(url, json=payload, timeout=30).json()
              # هنا نفترض أن الذكاء سيعيد JSON فيه الملفات الثلاثة
              raw_data = res['candidates'][0]['content']['parts'][0]['text']
              data = json.loads(raw_data)
              with open('main.py', 'w') as f: f.write(data.get('main_py', '# error'))
              with open('buildozer.spec', 'w') as f: f.write(data.get('spec', ''))
              with open('executor.yml', 'w') as f: f.write(data.get('workflow', ''))
          except:
              # في حال فشل الذكاء، نحقن "كود النجاة" يدوياً
              print("AI fallback initiated...")
          EOF

      - name: "Deep Injection (Correcting every cm)"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          
          # حقن الكود
          cp main.py temp_full/main.py
          cp buildozer.spec temp_full/buildozer.spec
          
          # حقن "طريقة البناء" نفسها (تصحيح المنفذ من الداخل)
          mkdir -p temp_full/.github/workflows
          cp executor.yml temp_full/.github/workflows/executor.yml
          
          cd temp_full
          git add . && git commit -m "Sovereign: Correcting System, Spec, and Code" && git push origin main
          
          # إطلاق المنفذ المحدث
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"