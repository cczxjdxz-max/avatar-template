name: 1. The Sovereign Overseer (Self-Healing Mode)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_up_call, executor_failed]

jobs:
  manage_and_fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Accessing Sovereign Realm"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Gemini IQ 250: Error Analysis & Reverse Engineering"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # استقبال الخطأ من المنفذ إذا وجد، وإلا البدء في التطوير
          ERROR_DATA="${{ github.event.client_payload.error || 'No error, continue optimization' }}"
          echo "Status Report: $ERROR_DATA"
          
          PROMPT="Act as Lelouch IQ 250. 
          Current Task: Deep Reverse Engineering of Hitscan mechanics and Accessibility Control.
          System Alert: $ERROR_DATA. 
          Instruction: If an error is present, FIX IT. If not, optimize the 'core_logic.py' for zero-spread micro-tapping and Arabic dialect intelligence. 
          The code must be self-correcting and autonomous. Output ONLY raw Python code."
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")
          
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed '/^```/d' | sed 's/null/None/g' > core_logic.py

      - name: "3. Persistence & Sovereign Sync"
        run: |
          git config --global user.name "Lelouch-Overseer"
          git config --global user.email "overseer@britannia.ai"
          git add core_logic.py
          git commit -m "Auto-Repair Cycle: Logic Refined" || echo "System Stable"
          git push origin main --force
          sleep 300

      - name: "4. Deployment Signal"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          URL="[https://api.github.com/repos/cczxjdxz-max/Full/dispatches](https://api.github.com/repos/cczxjdxz-max/Full/dispatches)"
          curl -X POST "$URL" \
               -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               -d '{"event_type": "continue_mission"}'