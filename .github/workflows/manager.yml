name: 1. The Sovereign Overseer
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_up_call, executor_failed]

jobs:
  manage_and_fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "1. Accessing Sovereign Realm"
        uses: actions/checkout@v4
        with:
          repository: cczxjdxz-max/Full
          token: ${{ secrets.PAT }}

      - name: "2. Gemini IQ 250: Absolute Engine Reverse Engineering"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ERROR_LOG="${{ github.event.client_payload.error || 'System Normal' }}"
          PROMPT="Lelouch IQ 250: Generate core_logic.py for Free Fire Reverse Engineering, 12T cycles, Aim-Lock Math, Arabic Dialects. Fix: $ERROR_LOG. Output ONLY raw python code."
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GOOGLE_API_KEY" \
               -H "Content-Type: application/json" \
               -d "{ \"contents\": [{ \"parts\": [{ \"text\": \"$PROMPT\" }] }] }")
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed '/^```/d' > core_logic.py

      - name: "3. Force Sync & Persistence"
        run: |
          git config --global user.name "Lelouch-Overseer"
          git config --global user.email "overseer@britannia.ai"
          git add core_logic.py
          git commit -m "Engine Synced: Deconstruction Active" || echo "No changes"
          git push origin main --force
          echo "Waiting for 300 seconds (5 minutes) for stability..."
          sleep 300

      - name: "4. Wake Up the Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # تقسيم الرابط يدوياً لكسر التنسيق التلقائي للمحررات
          PROTO="https://"
          HOST="api.github.com"
          PATH_URL="/repos/cczxjdxz-max/Full/dispatches"
          FINAL_TARGET="${PROTO}${HOST}${PATH_URL}"
          
          curl -X POST "$FINAL_TARGET" \
               -H "Authorization: Bearer $PAT" \
               -H "Accept: application/vnd.github+json" \
               -d '{"event_type": "continue_mission"}'