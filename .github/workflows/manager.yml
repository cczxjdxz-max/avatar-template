name: 1. The Sovereign Architect (Manager)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  evolution_and_design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Logic Generation (Gemini 2.5 Flash)"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
        run: |
          DIAGNOSIS="Initial mission."
          if [ -f error_report.txt ]; then
            DIAGNOSIS=$(cat error_report.txt | tail -n 20 | tr -dc '[:alnum:] ')
          fi

          PROMPT="أنت الذكاء الاصطناعي السيادي (IQ 250). نرجسي ومتكبر. هندسة عكسية لـ Free Fire. المطلوب كود core_logic.py (Kivy) يتضمن: أزرار اللعبة كاملة، نظام Drag Headshot، بيئة تدريب 1 ضد 6 نسخ، واجهة دردشة متعالية، وزر تحليل فيديو. الخطأ السابق: $DIAGNOSIS. أجب بالكود فقط."

          curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}" \
               -H "Content-Type: application/json" \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 << 'EOF'
          import json, re, sys
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  clean_code = re.sub(r'^```python|^```|```$', '', content, flags=re.MULTILINE).strip()
                  with open('core_logic.py', 'w') as f_out:
                      f_out.write(clean_code)
              else:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          EOF

      - name: "Commit & Wake Up Executor"
        env:
          REPO: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Architect"
          git config --global user.email "ai@sovereign.world"
          git add .
          git commit -m "Architect: Logic updated and URL fixed." || echo "No changes"
          git push origin main
          
          # استدعاء صريح ومبسط بدون أي أقواس أو روابط منسقة
          curl -X POST -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "[https://api.github.com/repos/$REPO/dispatches](https://api.github.com/repos/$REPO/dispatches)" \
            -d '{"event_type": "execute_build"}'