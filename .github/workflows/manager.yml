name: 1. The Manager (MIND) - Visualizer Architect

on:
  workflow_dispatch:

jobs:
  design_visualizer:
    runs-on: ubuntu-latest
    steps:
      - name: "Generate Visual Simulation Script"
        run: |
          python3 << 'EOF'
          import base64, os

          # سكربت 파يثون لتوليد الفيديو الرسومي
          visualizer_script = """
          import numpy as np
          import matplotlib.pyplot as plt
          import matplotlib.animation as animation

          def run_sim():
              fig, ax = plt.subplots(figsize=(10, 10))
              ax.set_xlim(0, 1000)
              ax.set_ylim(0, 1000)
              ax.set_facecolor('#1a1a1a')
              ax.set_title("AI Strategy Visualization: 1 vs 100", color='white')

              # تمثيل العناصر
              hero, = ax.plot([], [], 'oc', markersize=12, label='Hero (AI)')
              enemies, = ax.plot([], [], 'or', markersize=4, alpha=0.5, label='100 Enemies')
              walls = [ax.plot([], [], '-g', linewidth=3, alpha=0.8)[0] for _ in range(6)]
              aim_line, = ax.plot([], [], '--y', alpha=0.4, linewidth=1)

              # بيانات أولية
              hero_pos = np.array([500.0, 500.0])
              enemy_pos = np.random.uniform(100, 900, (100, 2))
              
              def init():
                  hero.set_data([], [])
                  enemies.set_data([], [])
                  aim_line.set_data([], [])
                  return [hero, enemies, aim_line] + walls

              def update(frame):
                  nonlocal hero_pos
                  # البطل يتحرك بذكاء (Micro-Evasion)
                  hero_pos += np.random.uniform(-8, 8, 2)
                  
                  # الأعداء يزحفون نحو البطل
                  for i in range(100):
                      vec = hero_pos - enemy_pos[i]
                      enemy_pos[i] += (vec / np.linalg.norm(vec)) * 2
                  
                  # رسم جدران الثلج بشكل سداسي حول البطل (V-Shape Logic)
                  for i, w in enumerate(walls):
                      angle = np.linspace(0, 2*np.pi, 7)[i]
                      wx = [hero_pos[0] + 30*np.cos(angle), hero_pos[0] + 50*np.cos(angle+0.5)]
                      wy = [hero_pos[1] + 30*np.sin(angle), hero_pos[1] + 50*np.sin(angle+0.5)]
                      w.set_data(wx, wy)

                  # تصويب لحظي على أقرب هدف (Frame-Snap)
                  target = enemy_pos[frame % 100]
                  aim_line.set_data([hero_pos[0], target[0]], [hero_pos[1], target[1]])
                  
                  hero.set_data([hero_pos[0]], [hero_pos[1]])
                  enemies.set_data(enemy_pos[:, 0], enemy_pos[:, 1])
                  return [hero, enemies, aim_line] + walls

              ani = animation.FuncAnimation(fig, update, frames=150, init_func=init, blit=True, interval=50)
              ani.save('combat_simulation.gif', writer='pillow')

          if __name__ == '__main__':
              run_sim()
          """
          
          encoded_plan = base64.b64encode(visualizer_script.encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ENCODED_PLAN={encoded_plan}\n")
          EOF

      - name: "Dispatch Action"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: generate_video
          client-payload: '{"plan_base64": "${{ env.ENCODED_PLAN }}" }'