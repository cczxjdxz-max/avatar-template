name: 1. The Sovereign Physician (Task Monitor)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  analyze_all_tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Multi-Task Healing"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TASK_REPORTS: ${{ github.event.client_payload.task_reports }} # تقرير بكل المهام
        run: |
          PROMPT="أنت الذكاء السيادي. إليك تقرير كامل عن عدة مهام (تسجيل دخول، محاكاة، اختبار طلقات).
          بعض المهام فشلت وبعضها نجح. التقرير: $TASK_REPORTS.
          المطلوب: إصلاح الكود البرمجي (main.py) ليعالج الأخطاء في المهام الفاشلة دون تخريب المهام الناجحة. 
          حافظ على موسيقى الهيبة ونرجسية الواجهة."

          # استدعاء Gemini لمعالجة التقرير الشامل
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 -c "import json, re; d=json.load(open('response.json')); c=d['candidates'][0]['content']['parts'][0]['text']; print(re.sub(r'```python|```', '', c).strip())" > main.py

      - name: "Push & Re-Trigger"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full && git add . && git commit -m "Leader: Multi-task healing applied" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"