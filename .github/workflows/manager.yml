      - name: "Generate Execution Plan (Script)"
        id: generate_script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import os, subprocess, json

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          
          # إعداد البيانات لإرسالها في الـ curl
          prompt_text = f"You are a world-class reverse engineering expert. Generate a single, self-contained Python script to be executed in a GitHub Actions environment. Objective: Extract core game data from an APK at {download_url}. The script must install unzip/wget, download the apk, try extracting it, and filter (json, xml, lua, weapon, map) to CORE_DATA. Generate ONLY the Python code inside ```python ... ```."
          
          payload = {
              "contents": [{
                  "parts": [{
                      "text": prompt_text
                  }]
              }]
          }

          # أمر الـ curl الذي طلبته بالضبط
          curl_cmd = [
              "curl",
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent",
              "-H", "Content-Type: application/json",
              "-H", f"x-goog-api-key: {api_key}",
              "-X", "POST",
              "-d", json.dumps(payload)
          ]

          try:
              result = subprocess.run(curl_cmd, capture_output=True, text=True, check=True)
              response = json.loads(result.stdout)
              content = response["candidates"][0]["content"]["parts"][0]["text"]
              
              # استخراج الكود البرمجي فقط
              if "```python" in content:
                  script_code = content.split("```python")[1].split("```")[0].strip()
              else:
                  script_code = content.strip()
          except Exception as e:
              script_code = f"import os\nprint('Fallback mode')\nos.system('wget {download_url} -O game.apk')"

          # حفظ السكربت كمتغير بيئة آمن للنقل
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PLAN_SCRIPT={json.dumps(script_code)}\n")
          EOF