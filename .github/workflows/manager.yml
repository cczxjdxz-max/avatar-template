name: 1. The Sovereign Physician (Quota Resilient)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sequential_heal_request]

jobs:
  leadership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Sovereign AI Reasoning with Auto-Retry"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPORTS: ${{ github.event.client_payload.task_reports || 'System Startup' }}
        run: |
          python3 << 'EOF'
          import os, json, requests, sys, time

          api_key = os.getenv('GOOGLE_API_KEY')
          reports = os.getenv('REPORTS')
          
          prompt_text = f"أنت الذكاء السيادي. المهمة: كود Python لملف main.py (Kivy/OpenCV). المواصفات: واجهة سوداء وذهبية نرجسية، موسيقى هيبة، محاكاة 5 تريليون دورة. التقرير: {reports}. أصلح أي خطأ لضمان 'كل طلقة أحمر' في فري فاير (حساب ضيف). أجب بالكود فقط."
          
          # قائمة الموديلات المتاحة (بالترتيب من الأفضل للأكثر توفراً)
          models = ["gemini-2.5-flash-lite", "gemini-1.5-flash", "gemini-1.5-pro"]
          
          def try_generate(model_name):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
              response = requests.post(url, json=payload)
              return response

          for model in models:
              print(f"Trying with model: {model}...")
              res = try_generate(model)
              data = res.json()
              
              if res.status_code == 429:
                  retry_after = 50 # الانتظار 50 ثانية حسب نصيحة جوجل
                  print(f"Quota exceeded for {model}. Waiting {retry_after}s...")
                  time.sleep(retry_after)
                  # المحاولة مرة أخرى لنفس الموديل بعد الانتظار
                  res = try_generate(model)
                  data = res.json()

              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  import re
                  clean_code = re.sub(r'```python|```', '', content).strip()
                  with open('main.py', 'w') as f:
                      f.write(clean_code)
                  print(f"Success! Code generated using {model}")
                  sys.exit(0)
              else:
                  print(f"Failed with {model}: {data.get('error', {}).get('message', 'Unknown error')}")
          
          print("All models failed or quota exceeded everywhere.")
          sys.exit(1)
          EOF

      - name: "Deploy to Executor"
        env:
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Leader"
          git clone "https://${PAT_TOKEN}@github.com/${{ github.repository_owner }}/Full.git" temp_full
          cp main.py temp_full/main.py
          cd temp_full
          echo "[app]\ntitle=Sovereign AI\npackage.name=sovereign.ai\nrequirements=python3,kivy,opencv,numpy,android\nandroid.api=33\nandroid.ndk=25b\nandroid.arch=arm64-v8a" > buildozer.spec
          git add . && git commit -m "Leader: Resilient Update via Multi-Model" && git push origin main
          curl -X POST -H "Authorization: token ${PAT_TOKEN}" -d '{"event_type": "execute_build"}' "https://api.github.com/repos/${{ github.repository_owner }}/Full/dispatches"