name: 1. The Manager (MIND) - Force Strike v9

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  design_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Generate Surgical Script (Bypassing AI Quota)"
        id: bypass
        env:
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import base64, os, json

          # هذا السكربت تم تجهيزه مسبقاً بناءً على خبرتنا في هيكل اللعبة
          # سيقوم بالتحميل والاستخراج بدقة دون الحاجة لـ Gemini
          surgical_script = f"""
          import os, subprocess, zipfile
          def run_mission():
              target_url = "{os.getenv('GAME_DOWNLOAD_URL')}"
              os.makedirs('CORE_DATA', exist_ok=True)
              print(f'Downloading APK from {{target_url}}...')
              subprocess.run(['wget', '-q', target_url, '-O', 'game.apk'], check=True)
              
              with zipfile.ZipFile('game.apk', 'r') as z:
                  for file in z.namelist():
                      # استهداف ملفات البرمجة والبيانات الرقمية حصراً
                      if any(x in file for x in ['Assembly-CSharp.dll', 'global-metadata.dat', '.json', '.bytes', '.lua']):
                          if 'assets/bin/Data/' in file or 'Managed' in file:
                              z.extract(file, 'CORE_DATA')
                              print(f'Captured: {{file}}')
          if __name__ == "__main__":
              run_mission()
          """
          
          encoded_plan = base64.b64encode(surgical_script.encode()).decode()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ENCODED_PLAN={encoded_plan}\n")
          EOF

      - name: "Issue Dispatch to Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_base64": "${{ env.ENCODED_PLAN }}" }'