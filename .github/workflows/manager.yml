name: 1. The Manager (MIND) - Surgical v8

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  design_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Install Dependencies"
        run: pip install requests

      - name: "Design Matrix Extraction Plan"
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import os, requests, json, sys

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          
          # برومبت دقيق لاستخراج بيانات محاكاة الذكاء الاصطناعي
          prompt_text = (
              f"Generate a self-contained Python 3 script. Target: {download_url}. "
              "The script must: 1. Download the APK. 2. Extract ONLY 'Assembly-CSharp.dll', "
              "'global-metadata.dat', and all '.json', '.bytes' files from 'assets/bin/Data/'. "
              "3. Place them in a folder named 'CORE_DATA'. "
              "Generate ONLY the code inside ```python ... ``` blocks."
          )
          
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          headers = {"Content-Type": "application/json", "x-goog-api-key": api_key}
          payload = {"contents": [{"parts": [{"text": prompt_text}]}]}

          try:
              response = requests.post(url, headers=headers, json=payload)
              data = response.json()
              
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  script_code = content.split("```python")[1].split("```")[0].strip()
                  
                  # كتابة السكربت في ملف مؤقت لمنع مشاكل الأسطر في البيئة
                  with open("generated_plan.py", "w") as f:
                      f.write(script_code)
                  
                  # تشفير السكربت لضمان نقله بأمان عبر الـ Dispatch
                  import base64
                  encoded_script = base64.b64encode(script_code.encode()).decode()
                  
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write(f"ENCODED_PLAN={encoded_script}\n")
              else:
                  print(f"API Error: {json.dumps(data, indent=2)}")
                  sys.exit(1)
          except Exception as e:
              print(f"Failed to connect: {e}")
              sys.exit(1)
          EOF

      - name: "Issue Dispatch to Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_base64": "${{ env.ENCODED_PLAN }}" }'