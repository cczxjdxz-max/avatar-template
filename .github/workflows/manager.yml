name: 1. The Manager (MIND) - Data Matrix Extractor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [analyze_failure]

jobs:
  design_and_command:
    runs-on: ubuntu-latest
    steps:
      - name: "Design Matrix Extraction Plan"
        id: design
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GAME_DOWNLOAD_URL: "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
        run: |
          python3 << 'EOF'
          import os, subprocess, json

          api_key = os.getenv("GOOGLE_API_KEY")
          download_url = os.getenv("GAME_DOWNLOAD_URL")
          
          prompt_text = f"""
          You are a Data Scientist and Reverse Engineer. 
          Target: Free Fire APK ({download_url}).
          Objective: Extract raw data for a non-graphical AI simulation (3 trillion iterations).
          
          FOCUS ON:
          1. CONFIGS: Extract all '.json', '.lua', '.xml', '.csv', and '.bytes' files.
          2. COORDINATES: Look for any file containing 'map_config', 'spawn_points', 'bounds'.
          3. PHYSICS & AI: Extract 'Assembly-CSharp.dll' to get the math for:
             - Bullet drop/velocity formulas.
             - Movement speed constants.
             - Hitbox dimensions (vectors).
          4. METADATA: 'global-metadata.dat' is mandatory.

          Generate ONLY the Python script to extract these specific data-only files to 'CORE_DATA/'.
          """
          
          try:
              payload = {"contents": [{"parts": [{"text": prompt_text}]}]}
              url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
              curl_cmd = ["curl", "-s", url, "-H", "Content-Type: application/json", "-H", f"x-goog-api-key: {api_key}", "-X", "POST", "-d", json.dumps(payload)]
              result = subprocess.run(curl_cmd, capture_output=True, text=True, check=True)
              response = json.loads(result.stdout)
              script_code = response["candidates"][0]["content"]["parts"][0]["text"].split("```python")[1].split("```")[0].strip()
          except:
              script_code = "import os\nos.makedirs('CORE_DATA', exist_ok=True)"

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PLAN_SCRIPT={json.dumps(script_code)}\n")
          EOF

      - name: "Dispatch to Executor"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: cczxjdxz-max/Full
          event-type: evolve_and_execute
          client-payload: '{"plan_script": ${{ env.PLAN_SCRIPT }} }'