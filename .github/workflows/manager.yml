name: 1. The Sovereign Architect (Manager)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [doctor_needed, start_mission]

jobs:
  evolution_and_design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Genius Local AI Generation"
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
        run: |
          PROMPT="أنت الذكاء السيادي (IQ 250). المطلوب بناء 'core_logic.py' يعمل OFFLINE تماماً. يتضمن: ذكاء محلي (NumPy/OpenCV) لتحليل أزرار فري فاير ونظام Drag Headshot، محاكي تدريب 1 ضد 6، تشفير داخلي، ودردشة نرجسية. أجب بالكود البرمجي الصافي فقط."

          # بناء رابط جوجل بطريقة التجزئة الآمنة
          G_PART1="https://generativelanguage.googleapis.com"
          G_PART2="/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}"
          
          curl -X POST "${G_PART1}${G_PART2}" \
               -H "Content-Type: application/json" \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}" > response.json

          python3 << 'EOF'
          import json, re, sys
          try:
              with open('response.json', 'r') as f:
                  data = json.load(f)
              if 'candidates' in data:
                  content = data['candidates'][0]['content']['parts'][0]['text']
                  clean_code = re.sub(r'^```python|^```|```$', '', content, flags=re.MULTILINE).strip()
                  with open('core_logic.py', 'w') as f_out:
                      f_out.write(clean_code)
              else:
                  sys.exit(1)
          except Exception:
              sys.exit(1)
          EOF

      - name: "Commit & Wake Up Executor"
        env:
          REPO_NAME: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.PAT }}
        run: |
          git config --global user.name "Sovereign-Architect"
          git config --global user.email "ai@sovereign.world"
          git add .
          git commit -m "Architect: On-Device AI Core Finalized." || echo "No changes"
          git push origin main
          
          # بناء الرابط بطريقة التقطيع لمنع حقن Markdown نهائياً
          P1="https"
          P2="api.github.com"
          P3="repos"
          
          CLEAN_URL="${P1}://${P2}/${P3}/${REPO_NAME}/dispatches"
          
          curl -v -X POST \
               -H "Authorization: token ${PAT_TOKEN}" \
               -H "Accept: application/vnd.github.v3+json" \
               -d '{"event_type": "execute_build"}' \
               "${CLEAN_URL}"