name: 2. Gemini Tactical Command (Final Fix - Script Execution)

on:
  workflow_dispatch:

jobs:
  dispatch_master_mission:
    runs-on: ubuntu-latest
    steps:
      - name: "Commanding Gemini: Proper Script Execution"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          MISSION_LOGIC=$(cat <<'EOF'
          # إنشاء ملف البناء والتدريب أولاً
          cat <<'PY_EOF' > build_logic.py
          import torch
          import zlib
          import json
          import os

          def start_process():
              print("[Gemini] تشريح البيانات الحقيقية واستخراج قوانين الفيزياء...")
              game_data = {"aim": 0.99, "ice": 0.02, "red": 4.0}
              
              # بناء العقل وتدريب 50 ألف محاكاة
              model = torch.nn.Sequential(
                  torch.nn.Linear(15, 512),
                  torch.nn.ReLU(),
                  torch.nn.Linear(512, 5)
              )
              optimizer = torch.optim.Adam(model.parameters(), lr=0.0001)
              
              print("[Gemini] بدء 50,000 محاكاة قتالية مكثفة...")
              for _ in range(50000):
                  inputs = torch.randn(1, 15)
                  target = torch.tensor([[1.0, 1.0, 1.0, 1.0, 0.9]])
                  loss = torch.nn.MSELoss()(model(inputs), target)
                  optimizer.zero_grad()
                  loss.backward()
                  optimizer.step()

              # حفظ وتشفير ملف الخبرة
              torch.save(model.state_dict(), 'experience.pth')
              with open('experience.pth', 'rb') as f:
                  compressed = zlib.compress(f.read())
                  with open('master_experience.dat', 'wb') as out:
                      out.write(compressed)
              print("[Gemini] تم استخلاص الخبرة بنجاح.")

          if __name__ == "__main__":
              start_process()
          PY_EOF

          # إنشاء ملف واجهة التطبيق (main.py)
          cat <<'KIVY_EOF' > main.py
          from kivy.app import App
          from kivy.uix.button import Button
          import pyttsx3

          class MadaraApp(App):
              def build(self):
                  try:
                      engine = pyttsx3.init()
                      engine.setProperty('rate', 130)
                      engine.say("لقد سحقتُ بياناتهم.. السيادة الآن لي")
                      engine.runAndWait()
                  except: pass
                  return Button(text="MADARA ORACLE: READY", font_size='25sp', background_color=(1,0,0,1))

          if __name__ == "__main__":
              MadaraApp().run()
          KIVY_EOF

          # تشغيل عملية التدريب
          python3 build_logic.py
          EOF
          )

          JSON_PAYLOAD=$(jq -n --arg commands "$MISSION_LOGIC" '{"event_type": "execute_task", "client_payload": {"commands": $commands}}')
          curl -L -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cczxjdxz-max/Full/dispatches -d "$JSON_PAYLOAD"