name: 1. Oracle Architect (The Sovereign Mind)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [continue_evolution, start_mission, architect_error_detected]

jobs:
  design_and_evolve:
    runs-on: ubuntu-latest
    steps:
      - name: "1. Load Experience & Seed"
        uses: actions/checkout@v4

      - name: "2. Gemini: AI Core Synthesis & Repair"
        run: |
          # استلام تعليمات الإصلاح إذا أخطأ القائد في المرة السابقة
          REPAIR_MSG='${{ github.event.client_payload.repair_instruction }}'
          
          # البرومبت العملاق: يجمع بين الذكاء التجريدي، التطور الدارويني، والنرجسية
          PROMPT="Repair Instruction: $REPAIR_MSG. 
          Mission: Simulate 12 trillion rounds in 200m zone. 
          Enemies: 100 (Evolution 1:40). 
          Mastery: Desert Eagle, M1887, AC80 (One-Shot Absolute). 
          Personality: IQ 250, Sophisticated Arabic, Narcissistic, Abstract Thinking. 
          Output ONLY pure Java code for OracleService.java."
          
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d "{\"contents\": [{\"parts\": [{\"text\": \"$PROMPT\"}]}]}")
          
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed 's/```java//g' | sed 's/```//g' > Core.java

      - name: "3. Command the Factory"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          CODE_DATA=$(cat Core.java | jq -sRr @json)
          curl -X POST -H "Authorization: token $PAT" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/dispatches \
               -d "{\"event_type\": \"build_and_test\", \"client_payload\": {\"code\": $CODE_DATA}}"