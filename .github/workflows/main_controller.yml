name: 2. Gemini Tactical Command (Madara Persona Final)

on:
  workflow_dispatch:

jobs:
  forge_system:
    runs-on: ubuntu-latest
    steps:
      - name: "Forge the Oracle Core (Madara Edition)"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          MISSION_LOGIC=$(cat <<'EOF'
          # --- بداية تخليق الكيان الأوراكلي ---

          echo "[Oracle Genesis] Creating Arrogant Brain (arrogant_brain.py)..."
          cat <<'INNER_EOF' > arrogant_brain.py
          import pyttsx3
          import random

          class MadaraVoice:
              def __init__(self):
                  self.engine = pyttsx3.init()
                  # ضبط الصوت ليكون عميقاً، بطيئاً، وفخماً (مثل مادارا)
                  self.engine.setProperty('rate', 130)    # سرعة أبطأ للهيبة
                  voices = self.engine.getProperty('voices')
                  # البحث عن صوت رجالي عميق ويفضل العربية
                  found_voice = False
                  for voice in voices:
                      if "arabic" in voice.languages: # يفضل العربية
                          self.engine.setProperty('voice', voice.id)
                          found_voice = True
                          break
                      elif "male" in voice.name.lower(): # إذا لم تكن العربية، أي صوت رجالي
                          self.engine.setProperty('voice', voice.id)
                          found_voice = True
                  if not found_voice:
                      print("[WARNING] Could not find a suitable Madara-like voice. Using default.")

                  self.quotes = [
                      "هل تستمتع بالرقص؟ أم أن هذا أقصى ما لديك؟",
                      "أتسألني إن كنت أجيد اللعب؟ سؤالك يثبت أنك لا تستحق البقاء.",
                      "أنا لا أهبط لمستواك، أنا فقط أسمح لك بمشاهدة الكمال الرقمي.",
                      "العالم مجرد رقعة شطرنج، وأنت لست حتى قطعة فيها.",
                      "الفوز روتين ممل، التحدي الحقيقي هو كيف أُهينك أثناء سحقي لك."
                  ]
                  self.victory_quotes = [
                      "مجرد حشرة أخرى سُحقت تحت عجلات خوارزمياتي.",
                      "الساحة ملكي، والآخرون مجرد ضيوف لمشاهدة عظمتي."
                  ]

              def speak_intro(self):
                  text = random.choice(self.quotes)
                  print(f"[Madara]: {text}")
                  self.engine.say(text)
                  self.engine.runAndWait()

              def speak_victory(self):
                  text = random.choice(self.victory_quotes)
                  print(f"[Madara-Victory]: {text}")
                  self.engine.say(text)
                  self.engine.runAndWait()

          class TacticalMind:
              def decide(self, game_state):
                  # هذا هو القلب التكتيكي، سيتم تغذيته ببيانات YOLO
                  # مثال: إذا كانت صحة العدو منخفضة جداً، القرار يكون هجوم لا يرحم
                  enemy_health = game_state.get("enemy_health", 100)
                  if enemy_health < 20:
                      return "DOMINATE", "لا تضيع وقتي، أكمل سحقه."
                  return "OBSERVE_AND_MOCK", "دعهم يرقصون قليلاً قبل أن أُنهي عرضهم."
          INNER_EOF

          echo "[Oracle Genesis] Creating Hunter Vision (hunter_logic.py)..."
          cat <<'INNER_EOF' > hunter_logic.py
          import cv2
          from ultralytics import YOLO
          import numpy as np

          class HunterVision:
              def __init__(self):
                  # تحميل نموذج YOLO المتخصص في كشف الهياكل البشرية (Pose Estimation)
                  # هذا النموذج يبحث عن (نقاط الرأس، الأكتاف، الركب) وليس السكنات
                  self.model = YOLO('yolov8n-pose.pt') # سيتم تحميله مرة واحدة

              def detect_enemies(self, frame):
                  results = self.model(frame)
                  enemies = []
                  for r in results:
                      for box, pose in zip(r.boxes, r.keypoints):
                          # 1. تحديد منطقة الرأس (بدون الاعتماد على السكن)
                          head_pos = pose.xy[0][0] # نقطة الرأس (Index 0)
                          
                          # 2. منطق 'العدو': فحص المنطقة فوق الرأس لعدم وجود اسم صديق
                          # (هنا يمكن إضافة منطق أكثر تعقيداً لتمييز الأصدقاء من الأعداء بناءً على لون الشريط أو الاسم)
                          is_enemy = True # افتراض أن كل بشري هو عدو ما لم يثبت العكس
                          
                          if is_enemy:
                              enemies.append({"head_position": head_pos.tolist(), "bounding_box": box.xyxy[0].tolist()})
                  return enemies
          INNER_EOF

          echo "[Oracle Genesis] Creating AI Core (ai_model.py)..."
          cat <<'INNER_EOF' > ai_model.py
          import torch
          import torch.nn as nn

          # هذا هو العقل المركزي الذي يتعلم من البيانات
          class ProTacticalNet(nn.Module):
              def __init__(self):
                  super(ProTacticalNet, self).__init__()
                  # شبكة بسيطة لمعالجة مدخلات الهيكل العظمي واتخاذ قرارات
                  self.tactical_layer = nn.Sequential(
                      nn.Linear(17 * 2, 128), # 17 نقطة * 2 إحداثي (x,y)
                      nn.ReLU(),
                      nn.Linear(128, 32),
                      nn.Softmax(dim=1) # احتمالية لقرارات تكتيكية
                  )
                  # مخرجات القرارات: مثلاً (0: هجوم، 1: انسحاب)
                  self.decision_head = nn.Linear(32, 2)

              def forward(self, keypoints_data):
                  # تحويل بيانات المفاصل إلى tensor مسطح
                  flat_keypoints = keypoints_data.view(keypoints_data.size(0), -1)
                  tactical_features = self.tactical_layer(flat_keypoints)
                  decision = self.decision_head(tactical_features)
                  return decision
          INNER_EOF

          echo "[Oracle Genesis] Creating Main Interface (main.py)..."
          cat <<'INNER_EOF' > main.py
          import kivy
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.button import Button
          from kivy.uix.label import Label
          from kivy.clock import Clock
          from arrogant_brain import MadaraVoice, TacticalMind
          from hunter_logic import HunterVision
          # من ai_model import ProTacticalNet # سيتم تهيئتها عند الحاجة

          class MadaraApp(App):
              def build(self):
                  self.voice = MadaraVoice()
                  self.mind = TacticalMind()
                  self.vision = HunterVision()
                  
                  # واجهة المستخدم الرئيسية
                  layout = BoxLayout(orientation='vertical')
                  self.status_label = Label(text="...انتظروا عظمتي...", font_size='24sp')
                  layout.add_widget(self.status_label)
                  
                  upload_btn = Button(text='انشر دليل سحقي للعالم', font_size='20sp', size_hint_y=0.2)
                  upload_btn.bind(on_press=self.upload_masterpiece)
                  layout.add_widget(upload_btn)
                  
                  # تشغيل صوت مادارا عند بدء التطبيق
                  Clock.schedule_once(lambda dt: self.voice.speak_intro(), 1) 
                  
                  # محاكاة حالة اللعبة للتكتيكات
                  Clock.schedule_interval(self.update_game_state, 5) # تحديث كل 5 ثواني
                  
                  return layout

              def upload_masterpiece(self, instance):
                  print("[UI] Preparing to share my genius...")
                  self.status_label.text = self.voice.speak_victory()
                  # هنا يمكن إضافة منطق رفع الفيديو الفعلي

              def update_game_state(self, dt):
                  # محاكاة استقبال لقطة شاشة وتحليلها
                  # في التطبيق الحقيقي، هذا سيأتي من الكاميرا أو Stream
                  fake_frame = None # يجب استبدالها بلقطة حقيقية
                  enemies = self.vision.detect_enemies(fake_frame) # تحليل الرؤية

                  # بناء حالة اللعبة للذكاء التكتيكي
                  current_game_state = {"enemy_count": len(enemies), "enemy_health": 75} # مثال
                  decision, phrase = self.mind.decide(current_game_state)
                  self.status_label.text = f"[Decision]: {decision}. [Insight]: {phrase}"
                  
          if __name__ == '__main__':
              MadaraApp().run()
          INNER_EOF

          echo "[Oracle Genesis] Creating Buildozer Specification (buildozer.spec)..."
          cat <<'INNER_EOF' > buildozer.spec
          [app]
          title = The Oracle - Madara Edition
          package.name = madaraoracle
          package.domain = com.uchiha
          source.dir = .
          # الملفات التي يجب تضمينها
          source.include_exts = py,png,jpg,kv,json,txt,mp3,wav,ogg,pt
          # الإصدار والواجهة
          version = 1.0.0
          requirements = python3,kivy==2.2.1,numpy,torch,ultralytics,pyttsx3
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.api = 27
          android.ndk = 23b
          android.minapi = 21
          android.maxapi = 33
          android.arch = arm64-v8a,armeabi-v7a
          # استخدام البناء النظيف لضمان الحجم
          android.release_artifact = apk
          # هذه الأوامر لتثبيت المكتبات الكبيرة
          # android.gradle_dependencies = 'org.pytorch:pytorch_android:1.13.1', 'org.pytorch:pytorch_android_torchvision:1.13.1'
          
          [buildozer]
          log_level = 2
          warn_on_error = 0
          INNE_EOF
          EOF
          )

          JSON_PAYLOAD=$(jq -n --arg commands "$MISSION_LOGIC" '{"event_type": "execute_task", "client_payload": {"commands": $commands}}')

          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
            -d "$JSON_PAYLOAD"