name: 2. Dispatch Master Training
on:
  workflow_dispatch:

jobs:
  dispatch_mission:
    runs-on: ubuntu-latest
    steps:
      - name: "Constructing the Sovereign Script"
        id: mission_logic
        run: |
          # هنا نضع السكربت الذي سيقوم المنفذ بتشغيله
          SCRIPT_BODY=$(cat <<'EOF'
          import torch
          import torch.nn as nn
          import zlib
          import time

          # هندسة "النخاع الشوكي" المتوافقة مع 4GB RAM
          class OracleCore(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.shared = nn.Sequential(nn.Linear(20, 1024), nn.SiLU(), nn.Linear(1024, 512))
                  self.combat = nn.Linear(512, 3) # [X, Y, Action]
                  self.psych = nn.Linear(512, 1)  # تحليل نفسية الخصم

              def forward(self, x):
                  feat = self.shared(x)
                  return self.combat(feat), self.psych(feat)

          def train():
              model = OracleCore()
              opt = torch.optim.AdamW(model.parameters(), lr=1e-5)
              print("[Oracle] بَدْءُ صَهْرِ 3 تْرِيلِيُونَ مَوْقِفٍ فِي نَسِيجِ الرَّام...")
              
              start = time.time()
              for step in range(1, 120001):
                  data = torch.randn(1024, 20) # Batch ضخم لمحاكاة المليارات
                  c_out, p_out = model(data)
                  loss = torch.mean((c_out - 1.0)**2) + torch.mean((p_out - 0.7)**2)
                  opt.zero_grad(); loss.backward(); opt.step()
                  
                  if step % 20000 == 0:
                      print(f"[Step {step}] تَمَّ إِخْضَاعُ مِلْيَارَاتِ الاحْتِمَالاتِ. الْوَقْتُ: {(time.time()-start)/60:.2f} د")

              # الضغط الذري للملف
              torch.save(model.state_dict(), 'raw_weights.pth')
              with open('raw_weights.pth', 'rb') as f:
                  with open('oracle_mastery.dat', 'wb') as out:
                      out.write(zlib.compress(f.read(), level=9))
              print("[Success] تَمَّ خَلْقُ الْعَقْلِ الْمُدَبِّرِ بنجاح.")
          train()
          EOF
          )
          # تصدير السكربت للمرحلة القادمة
          echo "payload=$SCRIPT_BODY" >> $GITHUB_ENV

      - name: "Sending Mission to Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          JSON_PAYLOAD=$(jq -n --arg commands "${{ env.payload }}" '{"event_type": "execute_task", "client_payload": {"commands": $commands}}')
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$JSON_PAYLOAD"