name: 2. Dispatch Master Training (Gemini 2.5 Full)
on:
  workflow_dispatch:

jobs:
  gemini_2_5_architect:
    runs-on: ubuntu-latest
    steps:
      - name: "Consulting Gemini 2.5 Flash Lite"
        id: gemini_api
        run: |
          # طلب التوجيه من جيمني 2.5
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "أنت المهندس المعماري للأوراكل. اشرح بيئة تدريب فري فاير (Drag Headshot، لا رياح، 4GB RAM) بأسلوب تقني مكثف."
                   }]
                 }]
               }')
          
          # استخراج النص وحفظه في ملف مؤقت لتجنب مشاكل الـ Bash
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > explanation.txt

      - name: "Constructing Sovereign Script"
        run: |
          # قراءة الشرح من الملف وحقنه في سكربت البايثون
          EXPLANATION_CONTENT=$(cat explanation.txt)
          
          cat <<'PY_EOF' > mission.py
          import torch
          import torch.nn as nn
          import zlib

          print("--- [Gemini 2.5 Flash Lite Training Blueprint] ---")
          # استخدام r""" لتجنب مشاكل الهروب في بايثون
          explanation = r"""EXPL_PLACEHOLDER"""
          print(explanation)
          print("-------------------------------------------------")

          class OracleCore(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.shared = nn.Sequential(nn.Linear(20, 1024), nn.SiLU(), nn.Linear(1024, 512))
                  self.combat = nn.Linear(512, 3) 
                  self.psych = nn.Linear(512, 1)

              def forward(self, x):
                  feat = self.shared(x)
                  return self.combat(feat), self.psych(feat)

          def train():
              model = OracleCore()
              optimizer = torch.optim.AdamW(model.parameters(), lr=1e-5)
              print("[Oracle] البدء في التدريب بناءً على رؤية 2.5 Flash...")
              for step in range(1, 120001):
                  data = torch.randn(1024, 20)
                  c, p = model(data)
                  loss = torch.mean((c-1.0)**2) + torch.mean((p-0.8)**2)
                  optimizer.zero_grad(); loss.backward(); optimizer.step()
              torch.save(model.state_dict(), 'core.pth')
              with open('oracle_mastery.dat', 'wb') as f:
                  f.write(zlib.compress(open('core.pth', 'rb').read(), 9))
              print("[Success] تم إنتاج العقل المطور.")
          if __name__ == "__main__":
              train()
          PY_EOF

          # استبدال العلامة النصية بالمحتوى الفعلي لجيمني بشكل آمن
          sed -i "s/EXPL_PLACEHOLDER/$(sed 's/[&/\]/\\&/g' explanation.txt | tr -d '\n' | tr -d '\r')/" mission.py
          
          # تحويل السكربت الجاهز إلى ملف JSON لإرساله بأمان
          jq -n --arg cmd "$(cat mission.py)" '{"event_type": "execute_task", "client_payload": {"commands": $cmd}}' > payload.json

      - name: "Sending Mission to Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          REPO_FULL_NAME="cczxjdxz-max/Full"
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_FULL_NAME/dispatches \
            -d @payload.json