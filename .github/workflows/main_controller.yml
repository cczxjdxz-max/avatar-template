name: 2. Dispatch Master Training (Fast Track)
on:
  workflow_dispatch:

jobs:
  gemini_architect:
    runs-on: ubuntu-latest
    steps:
      - name: "Consulting Gemini 2.5 Flash Lite"
        run: |
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "اشرح بيئة تدريب فري فاير (Drag Headshot، لا رياح، 4GB RAM) بأسلوب تقني مكثف لبناء نموذج عصبوني."
                   }]
                 }]
               }')
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > explanation.txt

      - name: "Constructing Fast-Track Script"
        run: |
          cat <<'PY_EOF' > mission.py
          import torch
          import torch.nn as nn
          import zlib
          import time

          print("--- [Gemini 2.5 Fast Training Blueprint] ---")
          with open('explanation.txt', 'r') as f: print(f.read())
          print("--------------------------------------------")

          class OracleCore(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.shared = nn.Sequential(nn.Linear(20, 1024), nn.SiLU(), nn.Linear(1024, 512))
                  self.combat = nn.Linear(512, 3) 
                  self.psych = nn.Linear(512, 1)

              def forward(self, x):
                  feat = self.shared(x)
                  return self.combat(feat), self.psych(feat)

          def train():
              model = OracleCore()
              # رفع معدل التعلم لتسريع الصهر لـ 15 دقيقة
              optimizer = torch.optim.AdamW(model.parameters(), lr=5e-4)
              print("[Oracle] بَدْءُ الصَّهْرِ السَّرِيعِ (40,000 خُطْوَةٍ مُكثَّفَةٍ)...")
              
              for step in range(1, 40001):
                  data = torch.randn(1024, 20)
                  c, p = model(data)
                  loss = torch.mean((c-1.0)**2) + torch.mean((p-0.8)**2)
                  optimizer.zero_grad(); loss.backward(); optimizer.step()
                  if step % 10000 == 0:
                      print(f"[Sync] تَمَّ إِتْمَامُ {step} خُطْوَةٍ.")

              torch.save(model.state_dict(), 'core.pth')
              with open('oracle_mastery.dat', 'wb') as f:
                  f.write(zlib.compress(open('core.pth', 'rb').read(), 9))
              print("[Success] تَمَّ خَلْقُ الْعَقْلِ بنجاح.")

          if __name__ == "__main__":
              train()
          PY_EOF
          
          # إعداد الحمولة بشكل آمن
          jq -n --arg cmd "$(cat mission.py)" --arg expl "$(cat explanation.txt)" \
            '{"event_type": "execute_task", "client_payload": {"commands": $cmd, "explanation": $expl}}' > payload.json

      - name: "Sending To Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          REPO_FULL_NAME="cczxjdxz-max/Full"
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_FULL_NAME/dispatches \
            -d @payload.json