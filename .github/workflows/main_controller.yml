name: 2. Gemini Main Controller

on:
  repository_dispatch:
    types: [executor_failed]
  schedule:
    - cron: '50 */5 * * *' # تجديد ذاتي كل 5 ساعات و50 دقيقة
  workflow_dispatch:

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - name: "Send Mission: Download & Analyze"
        run: |
          # هذه هي الأوامر التي ستنفذ صامتة بالكامل في المنفذ
          FULL_MISSION="sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends apktool curl binutils && \
          echo '[*] Downloading Game...' && \
          curl -L -f -o game.apk 'https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk' && \
          echo '[*] Decompiling...' && \
          apktool d game.apk -o extracted_game --force && \
          echo '[*] Extracting Constants...' && \
          find extracted_game/lib -name '*.so' -exec strings {} + | grep -E 'Damage|Speed|Bullet|Gravity' | head -n 100 > game_logic.txt && \
          echo '[*] Success. Data saved to game_logic.txt'"

          curl -L -X POST \
          -H "Authorization: Bearer ${{ secrets.PAT }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d "{
            \"event_type\": \"execute_task\",
            \"client_payload\": {
              \"commands\": \"$FULL_MISSION\"
            }
          }"

      - name: "Self-Renewal"
        run: |
          curl -L -X POST -H "Authorization: Bearer ${{ secrets.PAT }}" \
          https://api.github.com/repos/cczxjdxz-max/avatar-template/actions/workflows/main_controller.yml/dispatches \
          -d '{"ref":"main"}'