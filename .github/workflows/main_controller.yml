      - name: "Gemini Intelligence Dispatch"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # القائد يرسل الآن "مهمة ذكية" تفترض وجود الملفات سابقاً
          SMART_MISSION="if [ -f 'game.apk' ]; then \
            echo '[+] Using cached APK. Skipping download.'; \
          else \
            curl -L -o game.apk 'https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk'; \
          fi; \
          # البدء في تجهيز بيئة YOLO للتعرف على الأعداء
          sudo apt-get install -y python3-pip && \
          pip install ultralytics; \
          # استخراج إحداثيات العظام (Bones) من ملفات اللعبة المستخرجة
          grep -r 'Bone' data/extracted/ || echo 'Preparing bone mapping...'"

          FILE_URL="https://api.github.com/repos/cczxjdxz-max/Full/dispatches"
          
          curl -L -X POST -H "Authorization: Bearer $PAT" \
          -H "Accept: application/vnd.github+json" \
          $FILE_URL \
          -d "{
            \"event_type\": \"execute_task\",
            \"client_payload\": { \"commands\": \"$SMART_MISSION\" }
          }"