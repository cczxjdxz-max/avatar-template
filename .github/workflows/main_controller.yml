name: 2. Gemini Overlord (Brain)

on:
  repository_dispatch:
    types: [executor_failed]
  workflow_dispatch:

jobs:
  brain_operation:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Brain"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: "Dispatch Optimized Mission"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # المهمة: التحميل (عند الحاجة) -> التفكيك (عند الحاجة) -> استخراج القيم
          SMART_MISSION="if [ ! -f 'game.apk' ]; then \
            echo 'Downloading APK...'; \
            curl -L -o game.apk 'https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk'; \
          fi; \
          sudo apt-get update && sudo apt-get install -y apktool binutils; \
          if [ ! -d 'data/extracted' ]; then \
            echo 'Decompiling APK...'; \
            apktool d game.apk -o data/extracted --force; \
          fi; \
          echo 'Extracting Physics Report...'; \
          find data/extracted/lib -name '*.so' -exec strings {} + | grep -iE 'Damage|Recoil|Spread|Speed' | sort | uniq > physics_report.txt; \
          echo 'Mission Accomplished.'"

          curl -L -X POST -H "Authorization: Bearer $PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d "{
            \"event_type\": \"execute_task\",
            \"client_payload\": { \"commands\": \"$SMART_MISSION\" }
          }"