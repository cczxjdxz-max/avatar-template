name: 3. Oracle APK Architect & Dispatcher
on:
  workflow_dispatch:

jobs:
  dispatch_build:
    runs-on: ubuntu-latest
    steps:
      - name: "Gemini: Architecting UI & Chat"
        run: |
          # طلب كود واجهة الدردشة والخدمة من جيمني
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "Write a complete Android AccessibilityService in Java with a Floating Chat Window (Overlay). The chat must interact with a binary file 'oracle_mastery.dat'. Include narcissism in the UI strings and use AccessibilityService for drag gestures."
                   }]
                 }]
               }')
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' > OracleFinalCode.java

      - name: "Sending To Factory"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          REPO_FULL_NAME="cczxjdxz-max/Full"
          CODE_CONTENT=$(cat OracleFinalCode.java | jq -sRr @json)
          
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_FULL_NAME/dispatches \
            -d "{\"event_type\": \"build_apk\", \"client_payload\": {\"java_code\": $CODE_CONTENT}}"