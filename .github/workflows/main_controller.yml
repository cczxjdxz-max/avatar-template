name: 3. Oracle Ultimate Architect
on:
  workflow_dispatch:

jobs:
  architect_mission:
    runs-on: ubuntu-latest
    steps:
      - name: "Gemini: Designing Pure Logic"
        run: |
          # طلب الكود بتنسيق JSON آمن
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "Write ONLY the Java code for OracleService.java. Start directly with package com.oracle.sovereign; No markdown, no explanations."
                   }]
                 }]
               }')
          
          # استخراج الكود وتنظيفه
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed 's/```java//g' | sed 's/```//g' > OracleFinalCode.java

      - name: "Direct Link to Factory"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # تحويل الكود لنص JSON متوافق
          CODE_DATA=$(cat OracleFinalCode.java | jq -sRr @json)
          
          # إرسال الإشارة للمصنع (تأكد أن اسم المستودع صح)
          curl -X POST -H "Authorization: token $PAT" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/repos/${{ github.repository }}/dispatches \
               -d "{\"event_type\": \"oracle_build\", \"client_payload\": {\"java_code\": $CODE_DATA}}"