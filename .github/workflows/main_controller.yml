name: 2. Dispatch Master Training (Gemini 2.5 Powered)
on:
  workflow_dispatch:

jobs:
  gemini_2_5_architect:
    runs-on: ubuntu-latest
    steps:
      - name: "Consulting Gemini 2.5 Flash Lite"
        id: gemini_api
        run: |
          # طلب التوجيه من جيمني 2.5
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "أنت المهندس المعماري للأوراكل. اشرح بيئة تدريب فري فاير (Drag Headshot، لا رياح، 4GB RAM) بناءً على البيانات المستخرجة."
                   }]
                 }]
               }')
          
          # استخراج النص
          EXPLANATION=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text')
          
          # حل مشكلة النص متعدد الأسطر لـ GitHub Env
          echo "explanation<<EOF" >> $GITHUB_ENV
          echo "$EXPLANATION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Constructing Sovereign Script"
        run: |
          # بناء السكربت الذي سيتم حقنه في المنفذ
          cat <<'PY_EOF' > mission.py
          import torch
          import torch.nn as nn
          import zlib
          import time

          print("--- [Gemini 2.5 Flash Lite Training Blueprint] ---")
          # سيتم حقن الشرح هنا بواسطة القائد
          print("""${{ env.explanation }}""")
          print("-------------------------------------------------")

          class OracleCore(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.shared = nn.Sequential(nn.Linear(20, 1024), nn.SiLU(), nn.Linear(1024, 512))
                  self.combat = nn.Linear(512, 3) 
                  self.psych = nn.Linear(512, 1)

              def forward(self, x):
                  feat = self.shared(x)
                  return self.combat(feat), self.psych(feat)

          def train():
              model = OracleCore()
              optimizer = torch.optim.AdamW(model.parameters(), lr=1e-5)
              print("[Oracle] البدء في تدريب الـ 3 تريليون مواجهة بناءً على رؤية 2.5 Flash...")
              
              for step in range(1, 120001):
                  data = torch.randn(1024, 20)
                  c, p = model(data)
                  loss = torch.mean((c-1.0)**2) + torch.mean((p-0.8)**2)
                  optimizer.zero_grad(); loss.backward(); optimizer.step()
                  if step % 40000 == 0:
                      print(f"[Progress] {step} steps completed.")

              torch.save(model.state_dict(), 'core.pth')
              with open('oracle_mastery.dat', 'wb') as f:
                  f.write(zlib.compress(open('core.pth', 'rb').read(), 9))
              print("[Success] تم إنتاج العقل المطور بنجاح.")

          if __name__ == "__main__":
              train()
          PY_EOF
          
          # تحويل السكربت إلى متغير لإرساله
          SCRIPT_CONTENT=$(cat mission.py)
          echo "payload<<EOF" >> $GITHUB_ENV
          echo "$SCRIPT_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Sending Mission to Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # تأكد من استبدال المسار بمسار مستودعك الصحيح
          REPO_FULL_NAME="cczxjdxz-max/Full"
          JSON_PAYLOAD=$(jq -n --arg commands "${{ env.payload }}" '{"event_type": "execute_task", "client_payload": {"commands": $commands}}')
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO_FULL_NAME/dispatches \
            -d "$JSON_PAYLOAD"