name: 2. Gemini Overlord (Brain)

on:
  repository_dispatch:
    types: [executor_failed]
  workflow_dispatch:

jobs:
  brain_operation:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Brain"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: "Dispatch Smart Mission"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # المهمة الآن: التحقق من الكاش ثم البدء في تحليل العمق
          # قمت بدمج أوامر التحميل والتشريح لتعمل فقط عند الحاجة
          SMART_MISSION="if [ ! -f 'game.apk' ]; then \
            echo 'Cache empty. Downloading...'; \
            curl -L -o game.apk 'https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk'; \
          fi; \
          sudo apt-get update && sudo apt-get install -y apktool binutils; \
          if [ ! -d 'data/extracted' ]; then \
            apktool d game.apk -o data/extracted --force; \
          fi; \
          echo 'Starting Deep Analysis...'; \
          find data/extracted/lib -name '*.so' -exec strings {} + | grep -iE 'Damage|Recoil|Spread|Speed' > physics_report.txt"

          curl -L -X POST -H "Authorization: Bearer $PAT" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/cczxjdxz-max/Full/dispatches \
          -d "{
            \"event_type\": \"execute_task\",
            \"client_payload\": { \"commands\": \"$SMART_MISSION\" }
          }"

      # خطوة "التصحيح الذاتي" إذا أرسل المنفذ إشارة فشل
      - name: "Auto-Fix via Gemini"
        if: github.event_type == 'executor_failed'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ERROR_LOG: ${{ github.event.client_payload.log }}
        run: |
          echo "Gemini is analyzing the error: $ERROR_LOG"
