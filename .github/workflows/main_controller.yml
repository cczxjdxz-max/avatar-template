name: 2. Dispatch Master Training (Gemini 2.5 Powered)
on:
  workflow_dispatch:

jobs:
  gemini_2_5_architect:
    runs-on: ubuntu-latest
    steps:
      - name: "Consulting Gemini 2.5 Flash Lite"
        id: gemini_api
        run: |
          # تنفيذ طلب الـ curl الذي طلبته بالضبط لاستشارة الموديل 2.5
          RESPONSE=$(curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${{ secrets.GOOGLE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "contents": [{
                   "parts": [{
                     "text": "أنت الآن المهندس المعماري للأوراكل في فري فاير. اشرح بيئة التدريب بناءً على البيانات المستخرجة، ركز على الـ Drag Headshot وفيزياء اللعبة بدون رياح لـ 4GB RAM."
                   }]
                 }]
               }')
          
          # استخراج النص الناتج من جيمني 2.5
          EXPLANATION=$(echo $RESPONSE | jq -r '.candidates[0].content.parts[0].text')
          # تنظيف النص من أي رموز قد تعطل السكربت
          CLEAN_EXPLANATION=$(echo "$EXPLANATION" | tr -d '"' | tr -d "'")
          echo "explanation=$CLEAN_EXPLANATION" >> $GITHUB_ENV

      - name: "Constructing Sovereign Script"
        run: |
          # بناء السكربت الذي سيتم إرساله للمنفذ
          SCRIPT_BODY=$(cat <<EOF
          import torch
          import torch.nn as nn
          import zlib

          print("--- [Gemini 2.5 Flash Lite Instructions] ---")
          print("${{ env.explanation }}")
          print("--------------------------------------------")

          class OracleCore(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.shared = nn.Sequential(nn.Linear(20, 1024), nn.SiLU(), nn.Linear(1024, 512))
                  self.combat = nn.Linear(512, 3) 
                  self.psych = nn.Linear(512, 1)

              def forward(self, x):
                  feat = self.shared(x)
                  return self.combat(feat), self.psych(feat)

          def train():
              model = OracleCore()
              optimizer = torch.optim.AdamW(model.parameters(), lr=1e-5)
              print("[Oracle] البدء في تدريب الـ 3 تريليون مواجهة بناءً على رؤية 2.5 Flash...")
              
              # محاكاة التدريب المكثف
              for _ in range(120000):
                  data = torch.randn(1024, 20)
                  c, p = model(data)
                  loss = torch.mean(c**2) + torch.mean(p**2)
                  optimizer.zero_grad(); loss.backward(); optimizer.step()

              torch.save(model.state_dict(), 'core.pth')
              with open('oracle_mastery.dat', 'wb') as f:
                  f.write(zlib.compress(open('core.pth', 'rb').read(), 9))
              print("[Success] تم إنتاج العقل المطور.")
          train()
          EOF
          )
          echo "payload=$SCRIPT_BODY" >> $GITHUB_ENV

      - name: "Sending Intelligence to Executor"
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          JSON_PAYLOAD=$(jq -n --arg commands "${{ env.payload }}" '{"event_type": "execute_task", "client_payload": {"commands": $commands}}')
          curl -L -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "$JSON_PAYLOAD"