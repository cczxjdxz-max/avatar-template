name: GEASS-LAB-VERIFY

on:
  workflow_dispatch:

jobs:
  lab_check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. PULL ARTIFACT
        run: |
          # سحب النسخة التي تم بناؤها من الرابط
          curl -L "رابط_التحميل_الخاص_بك" -o Citadel_Final.apk

      - name: 2. SURGICAL AUDIT (الفحص الجراحي)
        run: |
          echo "🧪 Starting Laboratory Audit..."
          
          # فحص وجود ملف البايثون (النخاع)
          unzip -l Citadel_Final.apk | grep "assets/python/internal_master.py" && echo "✅ INTERNAL ENGINE: FOUND" || exit 1
          
          # فحص حقن الصلاحيات في الـ Manifest
          # سنقوم باستخراج الـ Manifest وفحصه نصياً
          unzip -p Citadel_Final.apk AndroidManifest.xml > manifest_dump
          if strings manifest_dump | grep -q "SYSTEM_ALERT_WINDOW"; then
            echo "✅ OVERLAY PERMISSIONS: ACTIVE"
          else
            echo "❌ PERMISSIONS MISSING"; exit 1
          fi

      - name: 3. SIGNATURE STABILITY CHECK
        run: |
          # التأكد من أن التوقيع سليم ولن يسبب "App Not Installed"
          sudo apt-get install -y apksigner
          apksigner verify --verbose Citadel_Final.apk && echo "✅ SIGNATURE: SECURE"

      - name: 4. FINAL VERDICT
        run: |
          echo "### 🔱 GEASS LAB REPORT 🔱" >> $GITHUB_STEP_SUMMARY
          echo "The APK has passed all structural tests." >> $GITHUB_STEP_SUMMARY
          echo "- **Engine Status:** Injected 💉" >> $GITHUB_STEP_SUMMARY
          echo "- **Overlay Status:** Authorized 🖥️" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment:** 100% Ready for Mobile/Emulator" >> $GITHUB_STEP_SUMMARY