name: GIAS-BIN-DEEP-SCANNER
on:
  workflow_dispatch:
  push:
    paths: ['geass2.yml']

jobs:
  deep_scan:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Environment
        run: |
          pip install UnityPy
          sudo apt-get install -y p7zip-full

      - name: 2. Download & Extraction
        run: |
          # تحميل ملف اللعبة
          wget -q -O game.apk "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
          # فك الضغط الشامل لضمان الوصول لمجلد bin
          unzip -o game.apk -d game_files
          echo "✅ APK extracted. Searching for bin folder..."
          # التأكد من مسار مجلد bin
          find game_files -name "bin" -type d

      - name: 3. Deep Mining Script (30K Files Scanner)
        run: |
          cat << 'EOF' > miner.py
          import UnityPy
          import json
          import os

          # المسار المتوقع لمجلد bin بعد فك الضغط
          # سنقوم بالبحث عن المجلد تلقائياً لضمان الدقة
          target_dir = ""
          for root, dirs, files in os.walk("game_files"):
              if root.endswith("bin"):
                  target_dir = root
                  break

          results = []

          def start_mining():
              if not target_dir:
                  print("❌ Error: 'bin' folder not found!")
                  return

              print(f"🚀 Found target: {target_dir}")
              print(f"🔍 Scanning files for Unity signatures...")
              
              count = 0
              for root, dirs, files in os.walk(target_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      
                      # تجاهل الملفات الصغيرة جداً لتسريع العملية
                      if os.path.getsize(file_path) < 5120:
                          continue
                          
                      try:
                          # محاولة فتح الملف كمحتوى Unity Assets
                          env = UnityPy.load(file_path)
                          
                          for obj in env.objects:
                              # استخراج أنواع البيانات التي تهمنا (الخرائط والفيزياء)
                              if obj.type.name in ["MonoBehaviour", "Mesh", "Transform", "GameObject"]:
                                  try:
                                      data = obj.read()
                                      name = getattr(data, 'name', 'Unnamed_Object')
                                      
                                      results.append({
                                          "file_id": file,
                                          "object_name": name,
                                          "object_type": obj.type.name,
                                          "data_size": obj.size
                                      })
                                      count += 1
                                  except:
                                      continue
                      except:
                          continue

              # حفظ كل ما تم العثور عليه في ملف واحد
              with open("precision_game_data.json", "w", encoding='utf-8') as f:
                  json.dump(results, f, indent=2)
              
              print(f"✅ Scanning Complete!")
              print(f"📦 Successfully extracted {count} objects from encrypted files.")
              print(f"📊 JSON Size: {os.path.getsize('precision_game_data.json') / 1024:.2f} KB")

          if __name__ == "__main__":
              start_mining()
          EOF
          python3 miner.py

      - name: 4. Upload Precision Data
        uses: actions/upload-artifact@v4
        with:
          name: BIN_FOLDER_EXTRACTED_DATA
          path: precision_game_data.json