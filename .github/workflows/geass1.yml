name: GIAS-DATA-PRECISION-EXTRACTOR
on:
  workflow_dispatch:

jobs:
  data_mining:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Environment
        run: |
          pip install UnityPy numpy
          mkdir -p DATA_OUT/Bermuda DATA_OUT/Physics DATA_OUT/Characters DATA_OUT/Weapons DATA_OUT/Gloo

      - name: 2. Download & Prep
        run: |
          wget -q -O game.apk "https://dl.cdn.freefiremobile.com/live/package/FreeFire.apk"
          unzip -o game.apk -d game_files

      - name: 3. Precision Data Extraction Script (Python)
        run: |
          cat << 'EOF' > extractor.py
          import UnityPy
          import json
          import os

          def extract_to_json(keyword, output_name):
              data_summary = []
              # البحث في ملفات اللعبة عن الكلمة المفتاحية
              for root, dirs, files in os.walk("game_files"):
                  for file in files:
                      if keyword in file.lower():
                          try:
                              env = UnityPy.load(os.path.join(root, file))
                              for obj in env.objects:
                                  if obj.type.name in ["MonoBehaviour", "GameObject", "Mesh"]:
                                      data = obj.read()
                                      # استخراج البيانات النصية أو الفيزيائية
                                      if hasattr(data, 'name'):
                                          data_summary.append({
                                              "name": data.name,
                                              "type": str(obj.type.name),
                                              "properties": str(data.raw_data)[:100] # عينة من البيانات الدقيقة
                                          })
                          except:
                              continue
              
              with open(f"DATA_OUT/{output_name}.json", "w", encoding='utf-8') as f:
                  json.dump(data_summary, f, ensure_ascii=False, indent=4)

          # تنفيذ الاستخراج النوعي للدقة
          extract_to_json("bermuda", "Bermuda/map_data")
          extract_to_json("physics", "Physics/engine_values")
          extract_to_json("char", "Characters/stats")
          extract_to_json("weapon", "Weapons/armory_specs")
          extract_to_json("gloo", "Gloo/resources_data")
          EOF
          python3 extractor.py

      - name: 4. Upload Precision Data
        uses: actions/upload-artifact@v4
        with:
          name: GIAS_PRECISION_JSON_DATA
          path: DATA_OUT/